<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的待办清单</title>
<style>
  :root {
    color-scheme: light;
    --gray-800: #1f2937;
    --gray-700: #374151;
    --gray-600: #4b5563;
    --gray-500: #6b7280;
    --gray-400: #9ca3af;
    --gray-300: #d1d5db;
    --gray-200: #e5e7eb;
    --gray-100: #f3f4f6;
    --gray-50: #f9fafb;
    --teal-600: #0d9488;
    --teal-700: #0f766e;
    --teal-50: #f0fdfa;
    --teal-800: #115e59;
    --green-800: #14532d;
    --green-600: #15803d;
    --green-500: #16a34a;
    --green-100: #dcfce7;
    --green-50: #f0fdf4;
    --red-800: #9f1239;
    --red-700: #be123c;
    --red-600: #e11d48;
    --red-500: #f43f5e;
    --red-400: #fb7185;
    --red-100: #ffe4e6;
    --red-50: #fff1f2;
    --yellow-800: #78350f;
    --yellow-600: #b45309;
    --yellow-500: #d97706;
    --yellow-100: #fef3c7;
    --yellow-50: #fffbeb;

    /* 语义层：色板变量在深色模式下整体反向，这一段负责真正的表面与投影 */
    --surface: #fff;
    --surface-glass: rgba(255, 255, 255, .75);
    --card-border: #dcebe7;
    --page-bg: var(--bgl);
    /* 背景配色：--bgl 浅色版、--bgd 深色版，由 [data-bg] 整对切换 */
    --bgl: linear-gradient(160deg, #f1f8f7 0%, #e0efec 55%, #cbe4df 100%);
    --bgd: linear-gradient(160deg, #0c1614 0%, #101c1a 55%, #14231f 100%);
    /* 自定义背景图上盖的一层遮罩，保证压在图上的文字仍读得清 */
    --bg-wash: rgba(255, 255, 255, .8);
    --bg-img: none;
    --on-accent: #fff;
    --shadow-card: 0 10px 15px -3px rgba(13, 61, 58, .08), 0 4px 6px -4px rgba(13, 61, 58, .06);
    --shadow-sm: 0 4px 6px -1px rgba(13, 61, 58, .1);
    --shadow-sm-hover: 0 10px 15px -3px rgba(13, 61, 58, .14);
    --shadow-btn: 0 4px 6px -1px rgba(13, 61, 58, .18);
    --shadow-btn-hover: 0 10px 15px -3px rgba(13, 61, 58, .22);
    --shadow-dialog: 0 25px 50px -12px rgba(15, 23, 42, .35);
    --scrim: rgba(15, 23, 42, .45);
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --gray-800: #e8f1ef;
    --gray-700: #cfe0dd;
    --gray-600: #aec5c0;
    --gray-500: #94aea9;
    --gray-400: #7e9b96;
    --gray-300: #435956;
    --gray-200: #2c403d;
    --gray-100: #233532;
    --gray-50: #1d2c29;
    --teal-600: #2dd4bf;
    --teal-700: #5eead4;
    --teal-50: #12312e;
    --teal-800: #99f6e4;
    --green-800: #bbf7d0;
    --green-600: #4ade80;
    --green-500: #34d399;
    --green-100: #1d3a26;
    --green-50: #16281c;
    --red-800: #fecdd3;
    --red-700: #fda4af;
    --red-600: #fb7185;
    --red-500: #f43f5e;
    --red-400: #fb7185;
    --red-100: #4c1d27;
    --red-50: #2c1620;
    --yellow-800: #fde68a;
    --yellow-600: #fbbf24;
    --yellow-500: #f59e0b;
    --yellow-100: #4a3616;
    --yellow-50: #2e2413;
    --surface: #172422;
    --surface-glass: rgba(255, 255, 255, .05);
    --card-border: #2b3f3c;
    --page-bg: var(--bgd);
    --bg-wash: rgba(8, 14, 13, .8);
    --on-accent: #04211f;
    --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, .5), 0 4px 6px -4px rgba(0, 0, 0, .45);
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, .45);
    --shadow-sm-hover: 0 10px 15px -3px rgba(0, 0, 0, .55);
    --shadow-btn: 0 4px 6px -1px rgba(0, 0, 0, .45);
    --shadow-btn-hover: 0 10px 15px -3px rgba(0, 0, 0, .55);
    --shadow-dialog: 0 25px 50px -12px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .7);
  }

  /* ---------- 背景配色：每套配浅色 / 深色列两个版本，跟随主题走 ---------- */
  [data-bg="mint"]  { --bgl: linear-gradient(160deg, #f1f8f7 0%, #e0efec 55%, #cbe4df 100%); --bgd: linear-gradient(160deg, #0c1614 0%, #101c1a 55%, #14231f 100%); }
  [data-bg="mist"]  { --bgl: linear-gradient(160deg, #f1f6fb 0%, #e2ecf7 55%, #cfe0f0 100%); --bgd: linear-gradient(160deg, #0b131c 0%, #0f1a26 55%, #142230 100%); }
  [data-bg="peach"] { --bgl: linear-gradient(160deg, #fdf5ef 0%, #fbe9db 55%, #f6d9c4 100%); --bgd: linear-gradient(160deg, #1a120c 0%, #241811 55%, #2d1f16 100%); }
  [data-bg="leaf"]  { --bgl: linear-gradient(160deg, #f4f9ef 0%, #e7f2dd 55%, #d6e9c9 100%); --bgd: linear-gradient(160deg, #0e160c 0%, #141f11 55%, #1b2917 100%); }
  [data-bg="lilac"] { --bgl: linear-gradient(160deg, #f7f5fd 0%, #eae6f8 55%, #dcd6f0 100%); --bgd: linear-gradient(160deg, #12101c 0%, #1a1728 55%, #221d33 100%); }
  [data-bg="rose"]  { --bgl: linear-gradient(160deg, #fdf4f6 0%, #f9e4e9 55%, #f2d2da 100%); --bgd: linear-gradient(160deg, #190f13 0%, #241419 55%, #2e1a21 100%); }
  [data-bg="sand"]  { --bgl: linear-gradient(160deg, #faf8f2 0%, #f1ecdf 55%, #e4dccb 100%); --bgd: linear-gradient(160deg, #15130e 0%, #1e1b14 55%, #272319 100%); }
  [data-bg="slate"] { --bgl: linear-gradient(160deg, #f5f6f7 0%, #e9ebee 55%, #d8dce1 100%); --bgd: linear-gradient(160deg, #101214 0%, #171a1e 55%, #1e2228 100%); }

  /* 自定义背景图：铺一层图 + 一层主题色遮罩，压暗/压亮到文字仍达 WCAG AA */
  html[data-bgimg="1"] body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(var(--bg-wash), var(--bg-wash)), var(--bg-img) center / cover no-repeat;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: var(--page-bg);
    background-attachment: fixed;
    color: var(--gray-800);
    padding: 24px 12px 48px;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .wrap { width: 100%; max-width: 672px; margin: 0 auto; }

  .card {
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow-card);
  }

  /* ---------- header ---------- */
  .head { position: relative; text-align: center; margin-bottom: 24px; padding-top: 12px; }

  .head-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--teal-700);
  }

  .head h1 { font-size: 30px; font-weight: 700; color: var(--gray-800); }

  .head p { font-size: 14px; color: var(--gray-600); }

  /* ---------- input card ---------- */
  .input-card { padding: 16px; margin-bottom: 16px; }

  .input-row { display: flex; flex-direction: column; gap: 12px; }

  #new-task {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    color: var(--gray-800);
    padding: 12px 16px;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    outline: none;
    transition: box-shadow .2s, border-color .2s;
  }

  #new-task::placeholder { color: var(--gray-500); }

  #new-task:focus {
    border-color: transparent;
    box-shadow: 0 0 0 2px var(--teal-600);
  }

  #add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 500;
    color: var(--on-accent);
    padding: 12px 24px;
    min-height: 48px;
    border-radius: 12px;
    background: var(--teal-700);
    box-shadow: var(--shadow-btn);
    transition: background .2s, box-shadow .2s;
  }

  #add:hover {
    background: var(--teal-800);
    box-shadow: var(--shadow-btn-hover);
  }

  .prio-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .prio-label { font-size: 14px; color: var(--gray-600); }

  .prio-btns { display: flex; gap: 4px; }

  .pbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 44px;
    min-height: 44px;
    padding: 12px;
    border-radius: 8px;
    background: var(--gray-100);
    color: var(--gray-600);
    font-size: 14px;
    transition: background .2s, color .2s;
  }

  .pbtn:hover { background: var(--gray-200); }

  .pbtn.on-high { background: var(--red-100); color: var(--red-600); }
  .pbtn.on-mid { background: var(--yellow-100); color: var(--yellow-600); }
  .pbtn.on-low { background: var(--green-100); color: var(--green-600); }

  .pbtn .txt { display: none; }

  .due-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .date-input {
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-800);
    padding: 8px 12px;
    min-height: 44px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
    background: var(--surface);
  }

  .date-input:focus { box-shadow: 0 0 0 2px var(--teal-600); border-color: transparent; }

  .due-clear { font-size: 13px; color: var(--gray-500); padding: 8px; min-height: 44px; }
  .due-clear:hover { color: var(--gray-700); }

  .tag-input {
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-800);
    width: 160px;
    max-width: 100%;
    padding: 8px 12px;
    min-height: 44px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
    background: var(--surface);
  }

  .tag-input:focus { box-shadow: 0 0 0 2px var(--teal-600); border-color: transparent; }

  .tag-hint { font-size: 12px; color: var(--gray-500); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
  }

  .stat {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    padding: 12px;
    text-align: center;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: background .2s;
  }

  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { background: var(--gray-50); }
  .stat.active { box-shadow: 0 0 0 2px var(--teal-600); }

  .stat b { font-size: 20px; font-weight: 700; }
  .stat b.accent { color: var(--teal-700); }
  .stat b.green { color: var(--green-600); }
  .stat span { font-size: 12px; color: var(--gray-600); }

  .tool-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .tbtn {
    font-size: 14px;
    font-weight: 500;
    color: var(--on-accent);
    padding: 12px 16px;
    min-height: 44px;
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    transition: background .2s, box-shadow .2s;
  }

  .tbtn:hover { box-shadow: var(--shadow-sm-hover); }
  .tbtn.red { background: var(--red-600); }
  .tbtn.red:hover { background: var(--red-700); }
  .tbtn.gray { background: var(--gray-500); }
  .tbtn.gray:hover { background: var(--gray-700); }

  /* ---------- list ---------- */
  .list-card { overflow: hidden; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 12px 0;
  }

  .filter-bar[hidden] { display: none; }

  .filter-bar + .filter-bar { margin-top: 8px; }

  .filter-label { font-size: 13px; color: var(--gray-500); margin-right: 2px; }

  .fbtn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    background: var(--gray-100);
    padding: 6px 12px;
    min-height: 36px;
    border-radius: 999px;
    transition: background .2s, color .2s;
  }

  .fbtn:hover { background: var(--gray-200); }
  .fbtn.on { background: var(--teal-700); color: var(--on-accent); }
  .fbtn .n { font-size: 12px; opacity: .8; }

  #list { list-style: none; }

  #list > li + li > .row { border-top: 1px solid var(--gray-100); }

  .row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px;
    border-left: 4px solid transparent;
    transition: background .2s;
  }

  .row:hover { background: var(--gray-50); }

  .row.p-high { border-left-color: var(--red-500); background: var(--red-50); }
  .row.p-mid { border-left-color: var(--yellow-500); background: var(--yellow-50); }
  .row.p-low { border-left-color: var(--green-500); background: var(--green-50); }
  .row.p-high:hover, .row.p-mid:hover, .row.p-low:hover { background: var(--gray-50); }
  .row.done { border-left-color: transparent; background: var(--gray-50); }

  .grip {
    color: var(--gray-500);
    width: 24px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: -8px;
    cursor: grab;
    touch-action: none;
    transition: color .2s;
  }

  .grip:hover { color: var(--gray-700); }
  li.dragging .grip { cursor: grabbing; }

  .tick {
    color: var(--teal-600);
    width: 44px;
    height: 44px;
    margin-left: -8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color .2s;
  }

  .tick:hover { color: var(--teal-700); }

  .body { flex: 1; min-width: 0; }

  .text-line {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .txt {
    font-size: 14px;
    color: var(--gray-800);
    word-break: break-word;
  }

  .done .txt {
    color: var(--gray-500);
    text-decoration: line-through;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 999px;
  }

  .badge.high { background: var(--red-100); color: var(--red-800); }
  .badge.mid { background: var(--yellow-100); color: var(--yellow-800); }
  .badge.low { background: var(--green-100); color: var(--green-800); }

  .due {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    color: var(--gray-600);
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--gray-100);
  }

  .due.soon { background: var(--teal-50); color: var(--teal-700); }
  .due.over { background: var(--red-100); color: var(--red-800); font-weight: 500; }

  .tg {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    color: var(--gray-600);
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--gray-200);
  }

  .done .tg { color: var(--gray-500); }

  li.dragging { opacity: .5; }
  li.dragging > .row { background: var(--teal-50); }
  li.drop-above { box-shadow: inset 0 3px 0 0 var(--teal-600); }
  li.drop-below { box-shadow: inset 0 -3px 0 0 var(--teal-600); }

  .list-empty {
    padding: 24px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--gray-500);
  }

  .acts { display: flex; align-items: center; gap: 4px; margin-left: 8px; }

  .ibtn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 8px;
    border-radius: 8px;
    transition: background .2s, color .2s;
  }

  .ibtn.edit { color: var(--teal-600); }
  .ibtn.edit:hover { color: var(--teal-700); background: var(--teal-50); }
  .ibtn.del { color: var(--red-500); }
  .ibtn.del:hover { color: var(--red-600); background: var(--red-50); }
  .ibtn.ok { color: var(--green-600); }
  .ibtn.ok:hover { color: var(--green-800); }
  .ibtn.no { color: var(--gray-600); }
  .ibtn.no:hover { color: var(--gray-800); }

  .edit-input {
    flex: 1 1 100%;
    min-width: 0;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-800);
    padding: 8px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
  }

  .edit-input:focus { box-shadow: 0 0 0 2px var(--teal-600); border-color: transparent; }

  .edit-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .edit-wrap .tag-input { flex: 1 1 120px; width: auto; }

  /* ---------- empty state ---------- */
  .empty {
    padding: 48px 16px;
    text-align: center;
  }

  .empty[hidden] { display: none; }

  .empty .ring { color: var(--gray-300); display: inline-flex; margin-bottom: 16px; }

  .empty h3 { font-size: 18px; font-weight: 600; color: var(--gray-800); margin-bottom: 8px; }

  .empty > p { font-size: 14px; color: var(--gray-600); }

  .steps {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .step b {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: var(--teal-50);
    color: var(--teal-700);
    font-size: 13px;
  }

  .step span { font-size: 12px; color: var(--gray-500); }

  /* ---------- history ---------- */
  .hist-card { padding: 16px; margin-top: 16px; }

  .hist-card[hidden] { display: none; }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .hist-head h3 { font-size: 18px; font-weight: 600; color: var(--gray-800); }

  .chev { color: var(--gray-500); padding: 4px; display: flex; transition: color .2s; }
  .chev:hover { color: var(--gray-700); }

  /* ---------- stats panel ---------- */
  .st-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .st-cell {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .st-cell b { display: block; font-size: 22px; line-height: 1.2; color: var(--gray-800); }
  .st-cell span { font-size: 12px; color: var(--gray-500); }
  .st-cell.warn b { color: var(--red-600); }

  .st-sec { margin-top: 16px; }

  .st-sec h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-500);
    margin-bottom: 6px;
  }

  .st-row { display: flex; align-items: center; gap: 8px; min-height: 28px; }

  .st-name {
    flex: 0 0 76px;
    font-size: 13px;
    color: var(--gray-700);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .st-track {
    flex: 1;
    height: 8px;
    background: var(--gray-100);
    border-radius: 999px;
    overflow: hidden;
  }

  .st-fill { display: block; height: 100%; border-radius: 999px; background: var(--teal-600); transition: width .3s; }
  .st-fill.green { background: var(--green-600); }
  .st-fill.red { background: var(--red-500); }
  .st-fill.yellow { background: var(--yellow-500); }
  .st-fill.gray { background: var(--gray-400); }

  .st-num {
    flex: 0 0 52px;
    text-align: right;
    font-size: 12px;
    color: var(--gray-500);
    font-variant-numeric: tabular-nums;
  }

  .st-trend { display: flex; align-items: flex-end; gap: 6px; height: 96px; }

  .st-col {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }

<script>
  // 先定主题和背景再渲染，否则深色模式下每次打开都会闪一下白底
  try {
    var st = JSON.parse(localStorage.getItem('todo.prefs')) || {};
    var de = document.documentElement;
    de.dataset.theme = st.theme === 'light' || st.theme === 'dark' ? st.theme
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    de.dataset.bg = st.bg || 'mint';
    // 只认自己写进去的 base64 图片，避免把别处塞进 localStorage 的内容当样式解析
    var bg = localStorage.getItem('todo.bgimg');
    if (bg && /^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(bg)) {
      de.style.setProperty('--bg-img', 'url("' + bg + '")');
      de.dataset.bgimg = '1';
    }
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>

  const PATHS = {
    listTodo: '<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',

    note: '<path d="M15 12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1z"/><path d="M4 18h16"/><path d="M4 21h10"/><path d="M12 12v.01"/>',
    listChecks: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    undo: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    reply: '<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
  };

  function icon(name, size) {
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + PATHS[name] + '</svg>';
  }

  const LEVELS = {
    high: { label: '高', icon: 'flame' },
    mid: { label: '中', icon: 'scale' },
    low: { label: '低', icon: 'feather' },
  };

  const REPEATS = [
    { key: '', label: '不重复' },
    { key: 'daily', label: '每天' },
    { key: 'weekly', label: '每周' },
    { key: 'monthly', label: '每月' },
  ];

  const REPEAT_LABEL = {};
  for (const r of REPEATS) REPEAT_LABEL[r.key] = r.label;

  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const input = $('new-task');
  const prioBox = $('prio-btns');
  const newDue = $('new-due');
  const newTag = $('new-tag');
  const tagList = $('tag-list');
  const repBox = $('rep-btns');
  const searchBar = $('search-bar');
  const searchInput = $('search');
  const searchClear = $('search-clear');
  const themeBtn = $('theme-btn');
  const bgBtn = $('bg-btn');
  const bgPanel = $('bg-panel');
  const bgSwatches = $('bg-swatches');
  const bgPick = $('bg-pick');
  const bgClear = $('bg-clear');
  const bgFile = $('bg-file');
  const bgNote = $('bg-note');
  const filters = $('filters');
  const tagFilters = $('tag-filters');
  const list = $('list');
  const empty = $('empty');
  const history = $('history');
  const histBody = $('hist-body');
  const histList = $('hist-list');
  const histDate = $('hist-date');
  const histToggle = $('hist-toggle');
  const statsCard = $('stats');
  const statsBody = $('stats-body');
  const statsToggle = $('stats-toggle');
  const pendingCount = $('pending-count');
  const doneCount = $('done-count');
  const statDone = $('stat-done');
  const toggleHiddenBtn = $('toggle-hidden');
  const clearDoneBtn = $('clear-done');
  const clearAllBtn = $('clear-all');
  const total = $('total');
  const exportBtn = $('export-btn');
  const importBtn = $('import-btn');
  const importFile = $('import-file');
  const backupMsgEl = $('backup-msg');
  const modal = $('modal');
  const modalTitle = $('modal-title');
  const modalText = $('modal-text');
  const modalOk = $('modal-ok');
  const modalCancel = $('modal-cancel');
  const quickHint = $('quick-hint');
  const todayStrip = $('today-strip');
  const undoBar = $('undo-bar');
  const undoText = $('undo-text');
  const undoBtn = $('undo-btn');

  let tasks = load();
  let prefs = loadPrefs();
  let newPriority = 'mid';
  let newRepeat = '';
  let query = '';
  let editingId = null;
  let confirmAction = null;
  let dragging = null;
  const expanded = new Set();   // 哪些任务展开了备注/子任务面板（不跨会话保存）
  let undoSnap = null;
  let undoTimer = null;

  const FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'overdue', label: '已逾期' },
    { key: 'today', label: '今天到期' },
    { key: 'week', label: '未来 7 天' },
    { key: 'nodate', label: '无日期' },
  ];

  function load() {
    let raw;
    try {
      raw = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch {
      return [];
    }
    return raw.map(t => {
      const o = { priority: 'mid', completedAt: null, due: '', tag: '', repeat: '', note: '', subs: [], ...t };
      if (!(o.repeat in REPEAT_LABEL)) o.repeat = '';
      if (typeof o.note !== 'string') o.note = '';
      o.subs = (Array.isArray(o.subs) ? o.subs : [])
        .filter(s => s && typeof s.text === 'string' && s.text.trim())
        .map(s => ({ id: s.id || uid(), text: s.text, done: !!s.done }));
      return o;
    });
  }

  function loadPrefs() {
    const fallback = { hideCompleted: false, historyOpen: true, dateFilter: '', listFilter: 'all', tagFilter: 'all', statsOpen: true, theme: '', bg: 'mint', focusToday: false };
    try {
      return { ...fallback, ...(JSON.parse(localStorage.getItem(PREF)) || {}) };
    } catch {
      return fallback;
    }
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(tasks));
    localStorage.setItem(PREF, JSON.stringify(prefs));
  }

  function uid() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  // 首次（或升级版本时）把清单导入，已存在同名任务则跳过，避免重复
  function seed() {
    let applied = 0;
    try {
      applied = Number(localStorage.getItem(SEED_KEY)) || 0;
    } catch {
      applied = 0;
    }
    if (applied >= SEED_VERSION) return;

    // 已经存在于本机清单里的同名任务：只补空分类，用户自己填过的不动
    const seedTag = new Map();
    for (const item of SEED_TASKS) if (item.tag) seedTag.set(item.text, item.tag);
    for (const t of tasks) if (!t.tag && seedTag.has(t.text)) t.tag = seedTag.get(t.text);

    const existing = new Set(tasks.map(t => t.text));
    for (const item of SEED_TASKS) {
      if (existing.has(item.text)) continue;
      tasks.push({
        id: uid(),
        text: item.text,
        priority: item.priority,
        due: '',
        tag: item.tag || '',
        repeat: item.repeat || '',
        note: '',
        subs: [],
        done: false,
        completedAt: null,
        createdAt: Date.now(),
      });
      existing.add(item.text);
    }

    try {
      localStorage.setItem(SEED_KEY, String(SEED_VERSION));
    } catch {
      /* 忽略存储失败 */
    }
    save();
  }

  function level(task) {
    return LEVELS[task.priority] ? task.priority : 'mid';
  }

  function dayKey(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 把 'YYYY-MM-DD' 当本地日期解析，避免 UTC 偏移导致差一天
  function parseDay(s) {
    const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!p) return null;
    return new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3]));
  }

  // 形状对不上下文的脏日期（如 2026-13-45）会被 Date 顺延，这里直接挡掉
  function isDay(s) {
    const d = parseDay(s);
    return !!d && dayKey(d.getTime()) === s;
  }

  // 距今天多少天：负数=已逾期，0=今天
  function dueInDays(task) {
    const due = parseDay(task.due);
    if (!due) return null;
    const today = parseDay(dayKey(Date.now()));
    return Math.round((due - today) / 86400000);
  }

  // 日期筛选：all / overdue / today / week / nodate
  function matchDate(task, key) {
    if (key === 'all') return true;
    if (key === 'nodate') return !task.due;
    const d = dueInDays(task);
    if (d === null) return false;
    if (key === 'today') return d === 0;
    if (key === 'week') return d >= 0 && d <= 6;
    if (key === 'overdue') return d < 0 && !task.done;
    return true;
  }

  // 分类筛选：all / ''（未分类）/ 分类名
  function matchTag(task, key) {
    if (key === 'all') return true;
    return (task.tag || '') === key;
  }

  // 搜索：任务文字与分类名都算命中，不区分大小写
  function matchQuery(task) {
    if (!query) return true;
    const q = query.toLowerCase();
    return task.text.toLowerCase().includes(q) || (task.tag || '').toLowerCase().includes(q);
  }

  function matchFilter(task) {
    if (prefs.focusToday && !isTodayTask(task)) return false;
    return matchDate(task, prefs.listFilter) && matchTag(task, prefs.tagFilter) && matchQuery(task);
  }

  function activeTasks() {
    return prefs.hideCompleted ? tasks.filter(t => !t.done) : tasks;
  }

  function visibleTasks() {
    return activeTasks().filter(matchFilter);
  }

  function usedTags() {
    const set = new Set();
    for (const t of tasks) if (t.tag) set.add(t.tag);
    return [...set].sort((a, b) => a.localeCompare(b, 'zh'));
  }

  function dueText(task) {
    const d = dueInDays(task);
    if (d === null) return '';
    if (d < 0) return '逾期 ' + (-d) + ' 天';
    if (d === 0) return '今天到期';
    if (d === 1) return '明天到期';
    if (d <= 6) return d + ' 天后到期';
    return task.due.slice(5).replace('-', '/') + ' 到期';
  }

  // ---------- 今日专注 + 连续打卡 ----------
  function isTodayTask(task) {
    if (task.done) return false;
    const d = dueInDays(task);
    return d !== null && d <= 0;
  }

  // 从今天往前数，每天至少完成过一项任务才算连着
  function streakDays() {
    const days = new Set();
    for (const t of tasks) if (t.done && t.completedAt) days.add(dayKey(t.completedAt));
    if (!days.size) return 0;

    const cur = new Date();
    if (!days.has(dayKey(cur.getTime()))) {
      cur.setDate(cur.getDate() - 1);
      if (!days.has(dayKey(cur.getTime()))) return 0;
    }
    let n = 0;
    while (days.has(dayKey(cur.getTime()))) {
      n++;
      cur.setDate(cur.getDate() - 1);
    }
    return n;
  }

  function renderToday() {
    todayStrip.hidden = tasks.length === 0;
    if (!tasks.length) return;
    todayStrip.textContent = '';

    const fire = document.createElement('span');
    fire.className = 'st-fire';
    fire.innerHTML = icon('flame', 16);
    const streak = document.createElement('span');
    const days = streakDays();
    streak.append(fire, document.createTextNode(' ' + (days ? '连续打卡 ' + days + ' 天' : '今天完成 1 项就能开始连续打卡')));
    streak.title = '连续打卡：每天至少完成一项任务就能续上一天';

    const n = tasks.filter(isTodayTask).length;
    const info = document.createElement('span');
    info.textContent = n ? '今天要做 ' + n + ' 项' : '今天没有到期的任务';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ts-btn' + (prefs.focusToday ? ' on' : '');
    btn.textContent = prefs.focusToday ? '退出今日专注' : '只看今日';
    btn.setAttribute('aria-pressed', String(prefs.focusToday));
    btn.addEventListener('click', () => {
      prefs.focusToday = !prefs.focusToday;
      if (prefs.focusToday) prefs.listFilter = 'all';
      save();
      render();
    });

    todayStrip.append(streak, info, btn);
  }

  // ---------- 一句话快速添加：#分类 !高 @明天 ~每周 ----------
  const QUICK_PRIO = { '高': 'high', '中': 'mid', '低': 'low', '高优先': 'high', '中优先': 'mid', '低优先': 'low' };
  const QUICK_REPEAT = { '每天': 'daily', '每日': 'daily', '每周': 'weekly', '每星期': 'weekly', '每两周': 'weekly', '每月': 'monthly' };
  const QUICK_DAYWORDS = ['今天', '明天', '后天', '大后天'];
  const WEEK_NUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };

  function shiftDays(n) {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }

  function nextWeekday(w) {
    const now = new Date();
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let delta = (w - base.getDay() + 7) % 7;
    if (delta === 0) delta = 7;   // 「周五」在今天就是周五时，按下一周算
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() + delta);
  }

  function fromMD(mm, dd) {
    const now = new Date();
    let d = new Date(now.getFullYear(), mm - 1, dd);
    if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d = new Date(now.getFullYear() + 1, mm - 1, dd);
    return d;
  }

  // 把「明天 / 周五 / 下周一 / 10-20 / 2026-10-20」这类词换成真实日期，认不出来返回 null
  function quickDate(tok) {
    if (!tok) return null;
    if (QUICK_DAYWORDS.includes(tok)) return shiftDays(QUICK_DAYWORDS.indexOf(tok));
    let m = /^(?:下)?(?:周|星期)([一二三四五六日天])$/.exec(tok);
    if (m) return nextWeekday(WEEK_NUM[m[1]]);
    m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(tok);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    m = /^(\d{1,2})[-/](\d{1,2})$/.exec(tok);
    if (m) {
      const mm = Number(m[1]), dd = Number(m[2]);
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return fromMD(mm, dd);
    }
    return null;
  }

  function parseQuickAdd(raw) {
    // 中文输入法下 !＃＠～ 常常是全角，先统一
    let s = String(raw || '').replace(/[！＃＠～]/g, ch => ({ '！': '!', '＃': '#', '＠': '@', '～': '~' })[ch]);
    const parsed = [];
    let priority = '', due = '', tag = '', repeat = '';

    s = s.replace(/~(每天|每日|每周|每星期|每两周|每月)(?![一二三四五六日天])/g, (all, w) => {
      if (!repeat) { repeat = QUICK_REPEAT[w]; parsed.push('重复 ' + REPEAT_LABEL[repeat]); }
      return ' ';
    });
    s = s.replace(/!(高|中|低)(?:优先)?/g, (all, w) => {
      if (!priority) { priority = QUICK_PRIO[w]; parsed.push('优先级 ' + w); }
      return ' ';
    });
    s = s.replace(/#([^\s#＠@!~～]{1,12})/g, (all, w) => {
      if (!tag) { tag = w; parsed.push('分类 ' + w); }
      return ' ';
    });
    s = s.replace(/@(今天|明天|后天|大后天|下周[一二三四五六日天]|下星期[一二三四五六日天]|周[一二三四五六日天]|星期[一二三四五六日天]|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[-/]\d{1,2})/g, (all, w) => {
      const d = quickDate(w);
      if (d && !due) { due = dayKey(d.getTime()); parsed.push('到期 ' + (d.getMonth() + 1) + '/' + d.getDate()); }
      return d ? ' ' : all;
    });

    // 空格隔开的自然词也认（「明天 交周报」），但不切开词内部：「明天见」不会被认成日期
    const words = s.split(/\s+/).filter(Boolean);
    const kept = [];
    for (const w of words) {
      if (!repeat && QUICK_REPEAT[w]) { repeat = QUICK_REPEAT[w]; parsed.push('重复 ' + REPEAT_LABEL[repeat]); continue; }
      if (!priority && QUICK_PRIO[w]) { priority = QUICK_PRIO[w]; parsed.push('优先级 ' + w); continue; }
      if (!due && quickDate(w)) { due = dayKey(quickDate(w).getTime()); parsed.push('到期 ' + (quickDate(w).getMonth() + 1) + '/' + quickDate(w).getDate()); continue; }
      kept.push(w);
    }

    return { text: kept.join(' ').trim(), priority, due, tag, repeat, parsed };
  }

  function renderQuickHint() {
    const v = input.value.trim();
    const hit = v ? parseQuickAdd(v) : null;
    quickHint.textContent = '';
    const tip = document.createElement('span');

      tip.textContent = '快速添加：#分类 !高/中/低 @明天/周五/10-20 ~每周，例：写周报 #工作 !高 @周五';
      quickHint.append(tip);
      return;
    }
    for (const label of hit.parsed) {
      const chip = document.createElement('span');
      chip.className = 'qh';
      chip.textContent = label;
      quickHint.append(chip);
    }
    tip.textContent = '已识别，点「添加任务」生效';
    quickHint.append(tip);
  }

  function renderFilters() {
    filters.hidden = tasks.length === 0;    filters.textContent = '';

    label.className = 'filter-label';

  function renderTagFilters() {
    const tags = usedTags();
    tagFilters.hidden = tags.length === 0;
    tagFilters.textContent = '';
    if (!tags.length) return;

    const label = document.createElement('span');
    label.className = 'filter-label';

        prefs.tagFilter = it.key;

    tagList.textContent = '';
    for (const t of usedTags()) {
      const opt = document.createElement('option');
      opt.value = t;
      tagList.append(opt);

  function render() {
    list.textContent = '';

    if (prefs.tagFilter !== 'all' && prefs.tagFilter !== '' && !usedTags().includes(prefs.tagFilter)) {
      prefs.tagFilter = 'all';
      save();
    }

    const done = tasks.filter(t => t.done);
    const shown = visibleTasks();

    for (const task of shown) {
      list.append(renderRow(task));
    }

    if (tasks.length && !shown.length) {
      const conds = [];
      if (prefs.focusToday) conds.push('今日专注');
      if (prefs.listFilter !== 'all') conds.push(FILTERS.find(f => f.key === prefs.listFilter).label);
      if (prefs.tagFilter !== 'all') conds.push(prefs.tagFilter ? '分类「' + prefs.tagFilter + '」' : '未分类');
      if (query) conds.push('搜索「' + query + '」');
      const none = document.createElement('li');
      none.className = 'list-empty';
      none.textContent = conds.length
        ? '当前筛选条件下没有任务（' + conds.join(' · ') + '）'
        : '没有可显示的任务';
      list.append(none);
    }

    empty.hidden = tasks.length > 0;

    searchBar.hidden = tasks.length === 0;
    searchClear.hidden = !query;

    renderFilters();
    renderTagFilters();
    renderTagOptions();
    renderToday();
    renderHistory(done);
    renderStats(done);

    pendingCount.textContent = tasks.length - done.length;
    doneCount.textContent = done.length;
    total.textContent = '共 ' + tasks.length + ' 个任务' + (shown.length !== tasks.length ? '（当前显示 ' + shown.length + ' 个）' : '');
    toggleHiddenBtn.textContent = prefs.hideCompleted ? '显示已完成任务' : '隐藏已完成任务';
    statDone.classList.toggle('active', prefs.hideCompleted);
    clearDoneBtn.hidden = done.length === 0;
  }

  function renderRow(task) {
    const li = document.createElement('li');
    li.dataset.id = task.id;
    const row = document.createElement('div');
    row.className = 'row p-' + level(task) + (task.done ? ' done' : '');

    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.innerHTML = icon('grip', 18);
    grip.setAttribute('aria-label', '拖动排序');
    if (task.id === editingId) grip.style.visibility = 'hidden';
    else grip.addEventListener('pointerdown', (e) => startDrag(e, li, task.id));
    row.append(grip);

    const tick = document.createElement('button');
    tick.type = 'button';
    tick.className = 'tick';
    tick.innerHTML = icon(task.done ? 'checkCircle' : 'circle', 22);
    tick.setAttribute('aria-label', task.done ? '标记为未完成' : '标记为已完成');
    tick.addEventListener('click', () => toggle(task.id));
    row.append(tick);

    const body = document.createElement('div');
    body.className = 'body';

    if (task.id === editingId) {
      body.append(...editControls(task));
    } else {
      const line = document.createElement('div');
      line.className = 'text-line';

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = task.text;
      txt.title = '双击编辑';
      txt.addEventListener('dblclick', () => startEdit(task.id));

      const badge = document.createElement('span');
      badge.className = 'badge ' + level(task);
      badge.innerHTML = icon(LEVELS[level(task)].icon, 12) + LEVELS[level(task)].label;

      line.append(txt, badge);

      const d = dueInDays(task);
      if (d !== null) {
        const due = document.createElement('span');
        due.className = 'due' + (d < 0 ? ' over' : d <= 1 ? ' soon' : '');
        due.innerHTML = icon('calendar', 12) + dueText(task);
        line.append(due);
      }

      if (task.tag) {
        const tg = document.createElement('span');
        tg.className = 'tg';
        tg.innerHTML = icon('tag', 12);
        tg.append(task.tag);
        line.append(tg);
      }

      if (task.repeat) {
        const rp = document.createElement('span');
        rp.className = 'tg rp';
        rp.innerHTML = icon('repeat', 12);
        rp.append(REPEAT_LABEL[task.repeat]);
        rp.title = '重复' + REPEAT_LABEL[task.repeat] + '：完成后自动排下一次';
        line.append(rp);
      }

      const subs = task.subs || [];
      if (subs.length) {
        const sb = document.createElement('span');
        sb.className = 'tg sb';
        sb.innerHTML = icon('listChecks', 12);
        sb.append(subs.filter(s => s.done).length + '/' + subs.length);
        sb.title = '子任务已完成 ' + subs.filter(s => s.done).length + ' / ' + subs.length;
        line.append(sb);
      }

      if (task.note) {
        const nf = document.createElement('span');
        nf.className = 'note-flag';
        nf.innerHTML = icon('note', 14);
        nf.title = '备注：' + task.note.slice(0, 60);
        line.append(nf);
      }

      body.append(line);
      row.append(body);

      const acts = document.createElement('div');
      acts.className = 'acts';

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'ibtn edit';
      edit.innerHTML = icon('pencil', 18);
      edit.setAttribute('aria-label', '编辑任务');
      edit.addEventListener('click', () => startEdit(task.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'ibtn del';
      del.innerHTML = icon('trash', 18);
      del.setAttribute('aria-label', '删除任务');
      del.addEventListener('click', () => remove(task.id));

      const open = expanded.has(task.id);
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'ibtn more';
      more.innerHTML = icon('chevron' + (open ? 'Up' : 'Down'), 18);
      more.title = '备注与子任务';
      more.setAttribute('aria-label', open ? '收起备注与子任务' : '展开备注与子任务');
      more.setAttribute('aria-expanded', open ? 'true' : 'false');
      more.addEventListener('click', () => toggleExpanded(task.id));

      acts.append(more, edit, del);
      row.append(acts);
      li.append(row);
      if (open) li.append(detailPanel(task));
      return li;
    }

    row.append(body);
    li.append(row);
    return li;
  }

  function toggleExpanded(id) {
    if (expanded.has(id)) expanded.delete(id);
    else expanded.add(id);
    render();
  }

  // ---------- 备注 + 子任务面板 ----------
  function detailPanel(task) {
    const box = document.createElement('div');
    box.className = 'detail';

    const noteLabel = document.createElement('span');
    noteLabel.className = 'd-label';
    noteLabel.textContent = '备注';
    const note = document.createElement('textarea');
    note.className = 'note-input';
    note.rows = 3;
    note.maxLength = 500;
    note.placeholder = '补充说明、链接、注意事项…';
    note.setAttribute('aria-label', '备注');
    note.value = task.note || '';
    // 边写边存但不重渲染，否则光标会跳走
    note.addEventListener('input', () => {
      task.note = note.value;
      save();
      const flag = note.closest('li').querySelector('.note-flag');
      if (flag) flag.title = '备注：' + task.note.slice(0, 60);
    });

    const subLabel = document.createElement('span');
    subLabel.className = 'd-label';
    subLabel.textContent = '子任务';

    box.append(noteLabel, note, subLabel);

    for (const s of task.subs || []) box.append(subRow(task, s));

    const addRow = document.createElement('div');
    addRow.className = 'sub-add';
    const si = document.createElement('input');
    si.type = 'text';
    si.maxLength = 120;
    si.placeholder = '添加子任务，回车即可';
    si.setAttribute('aria-label', '新子任务');
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.textContent = '添加';
    const commit = () => {
      const text = si.value.trim();
      if (!text) return;
      if (!Array.isArray(task.subs)) task.subs = [];
      task.subs.push({ id: uid(), text, done: false });
      save();
      render();
    };
    sb.addEventListener('click', commit);
    si.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        commit();
      }
    });
    addRow.append(si, sb);
    box.append(addRow);
    return box;
  }

  function subRow(task, sub) {
    const row = document.createElement('div');
    row.className = 'sub' + (sub.done ? ' done' : '');

    const tick = document.createElement('button');
    tick.type = 'button';
    tick.className = 'sub-tick';
    tick.innerHTML = icon(sub.done ? 'checkCircle' : 'circle', 20);
    tick.setAttribute('aria-label', sub.done ? '标记子任务未完成' : '标记子任务完成');
    tick.addEventListener('click', () => {
      sub.done = !sub.done;
      save();
      render();
    });

    const txt = document.createElement('span');
    txt.className = 'sub-txt';
    txt.textContent = sub.text;

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'sub-del';
    del.innerHTML = icon('trash', 18);
    del.setAttribute('aria-label', '删除子任务');
    del.addEventListener('click', () => {
      task.subs = (task.subs || []).filter(s => s.id !== sub.id);
      save();
      render();
    });

    row.append(tick, txt, del);
    return row;
  }

  function editControls(task) {
    const wrap = document.createElement('div');
    wrap.className = 'edit-wrap';

    const box = document.createElement('input');
    box.type = 'text';
    box.className = 'edit-input';
    box.maxLength = 200;
    box.value = task.text;
    const dueBox = document.createElement('input');
    dueBox.type = 'date';
    dueBox.className = 'date-input';
    dueBox.value = task.due || '';
    dueBox.setAttribute('aria-label', '到期日');

    const tagBox = document.createElement('input');
    tagBox.type = 'text';
    tagBox.className = 'tag-input';
    tagBox.maxLength = 12;
    tagBox.list = 'tag-list';
    tagBox.value = task.tag || '';
    tagBox.placeholder = '分类';
    tagBox.setAttribute('aria-label', '分类');

    const repSel = document.createElement('select');
    repSel.className = 'sel-input';
    repSel.setAttribute('aria-label', '重复');
    for (const r of REPEATS) {
      const opt = document.createElement('option');
      opt.value = r.key;
      opt.textContent = r.key ? r.label + '重复' : r.label;
      repSel.append(opt);
    }
    repSel.value = task.repeat || '';

    const commit = () => commitEdit(task.id, box.value, dueBox.value, tagBox.value, repSel.value);

    box.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    tagBox.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'ibtn ok';
    ok.innerHTML = icon('check', 18);
    ok.setAttribute('aria-label', '保存');
    ok.addEventListener('click', commit);

    const no = document.createElement('button');
    no.type = 'button';
    no.className = 'ibtn no';
    no.innerHTML = icon('close', 18);
    no.setAttribute('aria-label', '取消编辑');
    no.addEventListener('click', cancelEdit);

    wrap.append(box, dueBox, tagBox, repSel, ok, no);
    return [wrap];

  function renderStats(done) {
    statsCard.hidden = tasks.length === 0;
    statsBody.hidden = !prefs.statsOpen;
    statsToggle.innerHTML = icon(prefs.statsOpen ? 'chevronUp' : 'chevronDown', 20);
    if (!tasks.length) return;

    statsBody.textContent = '';

    const count = fn => tasks.filter(fn).length;
    const grid = document.createElement('div');
    grid.className = 'st-grid';
    grid.append(
      statCell('完成率', Math.round((done.length / tasks.length) * 100) + '%'),
      statCell('已逾期', count(t => !t.done && dueInDays(t) !== null && dueInDays(t) < 0), count(t => !t.done && dueInDays(t) !== null && dueInDays(t) < 0) > 0),
      statCell('今天到期', count(t => !t.done && dueInDays(t) === 0)),
      statCell('未来 7 天', count(t => { const d = dueInDays(t); return !t.done && d !== null && d > 0 && d <= 6; })),
    );
    statsBody.append(grid);

    const overall = stSection('总进度');
    overall.append(statRow('已完成', done.length, tasks.length, 'green'));
    statsBody.append(overall);

    const tags = usedTags();
    if (tags.length) {
      const sec = stSection('按分类完成率');
      for (const tag of tags) {
        const g = tasks.filter(t => t.tag === tag);
        sec.append(statRow(tag, g.filter(t => t.done).length, g.length));
      }
      const none = tasks.filter(t => !t.tag);
      if (none.length) sec.append(statRow('未分类', none.filter(t => t.done).length, none.length, 'gray'));
      statsBody.append(sec);
    }

    const psec = stSection('按优先级完成率');
    const tone = { high: 'red', mid: 'yellow', low: 'green' };
    for (const key of Object.keys(LEVELS)) {
      const g = tasks.filter(t => level(t) === key);
      if (!g.length) continue;
      psec.append(statRow(LEVELS[key].label + '优先级', g.filter(t => t.done).length, g.length, tone[key]));
    }
    statsBody.append(psec);

    const tsec = stSection('近 7 天完成');
    const base = parseDay(dayKey(Date.now()));
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - i);
      days.push({ key: dayKey(d.getTime()), label: (d.getMonth() + 1) + '/' + d.getDate(), n: 0, today: i === 0 });
    }
    const byKey = new Map(days.map(d => [d.key, d]));
    for (const t of done) {
      const hit = byKey.get(dayKey(t.completedAt || 0));
      if (hit) hit.n++;
    }
    const max = Math.max(1, ...days.map(d => d.n));
    const trend = document.createElement('div');
    trend.className = 'st-trend';
    for (const d of days) {
      const col = document.createElement('div');
      col.className = 'st-col' + (d.today ? ' today' : '');

      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = d.n ? String(d.n) : '';

      const bar = document.createElement('span');
      bar.className = 'bar' + (d.n ? '' : ' zero');
      if (d.n) bar.style.height = Math.max(8, Math.round((d.n / max) * 58)) + 'px';
      bar.title = d.label + '：完成 ' + d.n + ' 个';

      const lab = document.createElement('span');
      lab.className = 'd';
      lab.textContent = d.label;

      col.append(v, bar, lab);
      trend.append(col);
    }
    tsec.append(trend);

    const note = document.createElement('p');
    note.className = 'st-hint';
    note.textContent = '近 7 天共完成 ' + days.reduce((s, d) => s + d.n, 0) + ' 个 · 统计的是全部任务，不受上方筛选影响';
    tsec.append(note);
    statsBody.append(tsec);
  }

  function renderHistory(done) {
    history.hidden = done.length === 0;
    histBody.hidden = !prefs.historyOpen;
    histToggle.innerHTML = icon(prefs.historyOpen ? 'chevronUp' : 'chevronDown', 20);
    histDate.value = prefs.dateFilter;

    if (!done.length) return;

    histList.textContent = '';
    const items = done
      .filter(t => !prefs.dateFilter || dayKey(t.completedAt || 0) === prefs.dateFilter)
      .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

    if (!items.length) {
      const none = document.createElement('div');
      none.className = 'hist-empty';
      none.textContent = '该日期没有已完成的任务';
      histList.append(none);
      return;
    }

    for (const task of items) {
      const item = document.createElement('div');
      item.className = 'hist-item';

      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.innerHTML = icon('checkCircle', 20);

      const info = document.createElement('div');
      info.className = 'info';

      const t = document.createElement('div');
      t.className = 't';
      t.textContent = task.text;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = '完成时间: ' + (task.completedAt ? new Date(task.completedAt).toLocaleString('zh-CN') : '—');

      info.append(t, time);

      const badge = document.createElement('span');
      badge.className = 'badge ' + level(task);
      badge.innerHTML = icon(LEVELS[level(task)].icon, 12) + LEVELS[level(task)].label;

      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'ibtn hist-back';
      back.title = '放回未完成';
      back.setAttribute('aria-label', '放回未完成');
      back.innerHTML = icon('reply', 18);
      back.addEventListener('click', () => reopenTask(task.id));

      item.append(ico, info, badge, back);
      histList.append(item);
    }
  }

  function reopenTask(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.done = false;
    t.completedAt = null;
    // 历史面板常带日期筛选，不清掉的话放回的任务会「消失」
    prefs.dateFilter = '';
    save();
    render();
  }

  // ---------- 拖拽排序（pointer 事件，鼠标与触摸通用） ----------
  function startDrag(ev, li, id) {
    if (dragging || (ev.button !== undefined && ev.button !== 0)) return;
    ev.preventDefault();

    const els = [...list.children].filter(el => el.dataset.id);
    const from = els.indexOf(li);
    if (from < 0) return;

    const rects = els.map(el => el.getBoundingClientRect());
    const startY = ev.clientY;
    let to = from;
    let moved = false;

    const mark = () => {
      for (const el of els) el.classList.remove('drop-above', 'drop-below');
      if (to === from) return;
      els[to].classList.add(to < from ? 'drop-above' : 'drop-below');
    };

    const onMove = (e) => {
      const dy = e.clientY - startY;
      if (!moved && Math.abs(dy) < 5) return;
      if (!moved) {
        moved = true;
        dragging = true;
        li.classList.add('dragging');
      }
      li.style.transform = 'translateY(' + dy + 'px)';
      let next = els.length - 1;
      for (let i = 0; i < rects.length; i++) {
        if (e.clientY < rects[i].top + rects[i].height / 2) {
          next = i;
          break;
        }
      }
      to = next;
      mark();
    };

    const finish = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', finish);
      document.removeEventListener('pointercancel', finish);
      li.classList.remove('dragging');
      li.style.transform = '';
      for (const el of els) el.classList.remove('drop-above', 'drop-below');
      dragging = null;
      if (moved && to !== from) {
        reorder(els.map(el => el.dataset.id), from, to);
        save();
      }
      render();
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', finish);
    document.addEventListener('pointercancel', finish);
  }

  // 在当前显示的序列里把第 from 项挪到 to；被筛选隐藏的项留在原槽位不动
  function reorder(visibleIds, from, to) {
    const ids = visibleIds.slice();
    const moved = ids.splice(from, 1);
    ids.splice(to > from ? to - 1 : to, 0, moved[0]);

    const vis = new Set(visibleIds);
    const slots = [];
    tasks.forEach((t, i) => { if (vis.has(t.id)) slots.push(i); });
    const byId = new Map(tasks.map(t => [t.id, t]));

    const next = tasks.slice();
    slots.forEach((slot, k) => { next[slot] = byId.get(ids[k]); });
    tasks = next;
  }

  function add(text, priority, due, tag, repeat) {
    tasks.push({ id: uid(), text, priority, due: due || '', tag: tag || '', repeat: repeat || '', note: '', subs: [], done: false, completedAt: null, createdAt: Date.now() });
    save();
    render();
  }

  // 下一次到期日：已经逾期的从今天往后推，不背旧账
  function nextDue(task) {
    const d = parseDay(task.due);
    if (!d) return '';
    const today = parseDay(dayKey(Date.now()));
    const from = d > today ? d : today;
    const y = from.getFullYear();
    const m = from.getMonth();
    const day = from.getDate();
    if (task.repeat === 'daily') return dayKey(new Date(y, m, day + 1).getTime());
    if (task.repeat === 'weekly') return dayKey(new Date(y, m, day + 7).getTime());
    if (task.repeat === 'monthly') {
      const last = new Date(y, m + 2, 0).getDate();
      return dayKey(new Date(y, m + 1, Math.min(day, last)).getTime());
    }
    return '';
  }

  function toggle(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    task.completedAt = task.done ? Date.now() : null;
    // 重复任务：完成的那条留在历史里（统计要用），紧跟着排出一条新的
    if (task.done && task.repeat) {
      tasks.splice(tasks.indexOf(task) + 1, 0, {
        id: uid(),
        text: task.text,
        priority: task.priority,
        due: nextDue(task),
        tag: task.tag,
        repeat: task.repeat,
        note: task.note || '',
        subs: (task.subs || []).map(s => ({ id: uid(), text: s.text, done: false })),
        done: false,
        completedAt: null,
        createdAt: Date.now(),
      });
    }
    save();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const box = list.querySelector('.edit-input');
    if (box) {
      box.focus();
      box.select();
    }
  }

  function commitEdit(id, value, due, tag, rep) {
    const task = tasks.find(t => t.id === id);
    const text = value.trim();
    if (task && text) {
      task.text = text;
      task.due = due || '';
      task.tag = tag.trim();
      task.repeat = rep && rep in REPEAT_LABEL ? rep : '';
    }
    editingId = null;
    save();
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function remove(id) {
    const gone = tasks.find(t => t.id === id);
    if (gone) snapshot('已删除「' + clip(gone.text) + '」', tasks);
    tasks = tasks.filter(t => t.id !== id);
    if (editingId === id) editingId = null;
    expanded.delete(id);
    save();
    render();
  }

  // ---------- 误删可撤销：删除前留一份全量快照，6 秒内可回滚 ----------
  function clip(text) {
    const t = String(text || '');
    return t.length > 18 ? t.slice(0, 18) + '…' : t;
  }

  function closeUndo() {
    clearTimeout(undoTimer);
    undoTimer = null;
    undoSnap = null;
    undoBar.hidden = true;
  }

  function snapshot(label, snap) {
    undoSnap = JSON.parse(JSON.stringify(snap));
    undoText.textContent = label;
    undoBar.hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(closeUndo, 6000);
  }

  function restoreUndo() {
    if (!undoSnap) return;
    tasks = undoSnap;
    closeUndo();
    save();
    render();
  }

  undoBtn.addEventListener('click', restoreUndo);

  function askConfirm(title, text, action) {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalOk.textContent = title;
    confirmAction = action;
    modal.hidden = false;
    modalOk.focus();
  }

  function closeConfirm() {
    modal.hidden = true;
    confirmAction = null;
  }

  // ---------- 备份：导出 / 导入 JSON ----------
  function backupMsg(text, isErr) {
    backupMsgEl.textContent = text;
    backupMsgEl.classList.toggle('err', !!isErr);
  }

  function exportBackup() {
    if (!tasks.length) {
      backupMsg('还没有任务可导出', true);
      return;
    }
    const data = { app: 'todo-list', version: 1, exportedAt: new Date().toISOString(), tasks };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '待办备份-' + dayKey(Date.now()) + '.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    backupMsg('已导出 ' + tasks.length + ' 条任务');
  }

  function normalizeImported(raw) {
    const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.tasks) ? raw.tasks : null);
    if (!list) return null;

    const seen = new Set();
    const out = [];
    for (const t of list) {
      if (!t || typeof t.text !== 'string' || !t.text.trim()) continue;
      let id = typeof t.id === 'string' && t.id ? t.id : uid();
      if (seen.has(id)) id = uid();
      seen.add(id);
      out.push({
        id,
        text: t.text.trim(),
        priority: LEVELS[t.priority] ? t.priority : 'mid',
        due: isDay(t.due) ? t.due : '',
        tag: typeof t.tag === 'string' ? t.tag.trim().slice(0, 12) : '',
        repeat: typeof t.repeat === 'string' && t.repeat in REPEAT_LABEL ? t.repeat : '',
        note: typeof t.note === 'string' ? t.note.slice(0, 500) : '',
        subs: (Array.isArray(t.subs) ? t.subs : [])
          .filter(s => s && typeof s.text === 'string' && s.text.trim())
          .slice(0, 50)
          .map(s => ({ id: typeof s.id === 'string' && s.id ? s.id : uid(), text: s.text.trim().slice(0, 120), done: !!s.done })),
        done: !!t.done,
        completedAt: typeof t.completedAt === 'number' ? t.completedAt : null,
        createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now(),
      });
    }
    return out;
  }

  function importBackup(file) {
    backupMsg('');
    const reader = new FileReader();
    reader.onerror = () => backupMsg('读取文件失败', true);
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch {
        backupMsg('这个文件不是有效的 JSON 备份', true);
        return;
      }
      const incoming = normalizeImported(parsed);
      if (!incoming) {
        backupMsg('文件里没有找到任务列表', true);
        return;
      }
      if (!incoming.length) {
        backupMsg('文件里的任务列表是空的', true);
        return;
      }
      askConfirm('导入备份', '将用备份里的 ' + incoming.length + ' 条任务覆盖当前 ' + tasks.length + ' 条，导入后 6 秒内可以撤销。', () => {
        snapshot('已导入备份，覆盖了原来 ' + tasks.length + ' 条任务', tasks);
        tasks = incoming;
        editingId = null;
        expanded.clear();
        backupMsg('已导入 ' + incoming.length + ' 条任务');
      });
    };
    reader.readAsText(file);
  }

  function submitTask() {
    const raw = input.value.trim();
    if (!raw) return;
    const hit = parseQuickAdd(raw);
    // 识别出来的语法优先，认不出来就照原样收进任务名
    const text = hit.text || raw;
    add(text,
      hit.priority || newPriority,
      hit.due || newDue.value,
      hit.tag || newTag.value.trim(),
      hit.repeat || newRepeat);
    input.value = '';
    newDue.value = '';
    renderQuickHint();
    input.focus();
  }

  // ---------- 主题：跟随系统 / 浅色 / 深色 三态循环 ----------
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const THEME = {
    '': { label: '跟随系统', icon: 'monitor' },
    light: { label: '浅色', icon: 'sun' },
    dark: { label: '深色', icon: 'moon' },
  };

  function applyTheme() {
    const mode = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : (darkMq.matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = mode;
    const cur = THEME[prefs.theme] || THEME[''];
    themeBtn.innerHTML = icon(cur.icon, 20);
    themeBtn.title = '主题：' + cur.label + '（当前' + (mode === 'dark' ? '深色' : '浅色') + '，点击切换）';
  }

  function cycleTheme() {
    prefs.theme = prefs.theme === '' ? 'light' : prefs.theme === 'light' ? 'dark' : '';
    save();
    applyTheme();
  }

  // ---------- 背景：预设配色 + 自己的图片 ----------
  const BGS = [
    { key: 'mint', label: '青绿' },
    { key: 'mist', label: '雾蓝' },
    { key: 'peach', label: '晨橙' },
    { key: 'leaf', label: '抹茶' },
    { key: 'lilac', label: '紫雾' },
    { key: 'rose', label: '玫瑰' },
    { key: 'sand', label: '米砂' },
    { key: 'slate', label: '石墨' },
  ];
  let bgImg = '';

  function applyBg() {
    const cur = prefs.bg || 'mint';
    document.documentElement.dataset.bg = cur;
    for (const el of bgSwatches.children) el.setAttribute('aria-pressed', String(el.dataset.bg === cur));
    const label = (BGS.find(b => b.key === cur) || BGS[0]).label;
    bgBtn.title = '换背景（当前：' + label + (bgImg ? ' + 自己的图片' : '') + '）';
  }

  function applyBgImg() {
    const de = document.documentElement;
    if (bgImg) {
      de.style.setProperty('--bg-img', 'url("' + bgImg + '")');
      de.dataset.bgimg = '1';
    } else {
      de.style.removeProperty('--bg-img');
      delete de.dataset.bgimg;
    }
    bgClear.disabled = !bgImg;
    applyBg();
  }

  function bgMsg(text, isErr) {
    bgNote.textContent = text;
    bgNote.classList.toggle('err', !!isErr);
  }

  // 原图直接塞 localStorage 会撑爆配额，先等比缩小再用 canvas 压一遍
  async function shrinkToDataUrl(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      await new Promise((ok, bad) => {
        img.onload = ok;
        img.onerror = () => bad(new Error('这张图片读不出来，换一张试试'));
        img.src = url;
      });
      let scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      for (let i = 0; i < 4; i++) {
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/webp', 0.8 - i * 0.08);
        if (data.length < 1400000) return data;
        scale *= 0.7;
      }
      throw new Error('这张图片压缩后还是太大，换一张小一点的');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  for (const b of BGS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sw';
    btn.dataset.bg = b.key;
    btn.title = '背景配色：' + b.label;
    btn.innerHTML = '<span class="sw-c"></span><span class="sw-t">' + b.label + '</span>';
    btn.addEventListener('click', () => {
      prefs.bg = b.key;
      save();
      applyBg();
    });
    bgSwatches.append(btn);
  }

  bgPick.addEventListener('click', () => bgFile.click());

  bgFile.addEventListener('change', async () => {
    const file = bgFile.files && bgFile.files[0];
    bgFile.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      bgMsg('只能选图片文件（jpg / png / webp）', true);
      return;
    }
    try {
      const data = await shrinkToDataUrl(file);
      try {
        localStorage.setItem(BGIMG, data);
      } catch {
        bgMsg('浏览器存储空间不够，这张图放不下', true);
        return;
      }
      bgImg = data;
      applyBgImg();
      bgMsg('已换上这张背景图');
    } catch (err) {
      bgMsg(err.message || '这张图片用不了', true);
    }
  });

  bgClear.addEventListener('click', () => {
    try {
      localStorage.removeItem(BGIMG);
    } catch {
      /* 存不下也就没什么可删 */
    }
    bgImg = '';
    applyBgImg();
    bgMsg('图片背景已清除');
  });

  function openBgPanel(open) {
    bgPanel.hidden = !open;
    bgBtn.setAttribute('aria-expanded', String(open));
    if (open) bgSwatches.querySelector('.sw[aria-pressed="true"]').focus();
  }

  bgBtn.addEventListener('click', () => openBgPanel(bgPanel.hidden));

  document.addEventListener('click', (e) => {
    if (!bgPanel.hidden && !bgPanel.contains(e.target) && !bgBtn.contains(e.target)) openBgPanel(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !bgPanel.hidden) {
      e.preventDefault();
      openBgPanel(false);
      bgBtn.focus();
    }
  });

  $('head-ico').innerHTML = icon('listTodo', 28);
  $('empty-ico').innerHTML = icon('circle', 56);
  $('modal-ico').innerHTML = icon('alert', 24);
  $('search-ico').innerHTML = icon('search', 18);
  undoBtn.innerHTML = icon('undo', 16) + '撤销';
  bgBtn.innerHTML = icon('image', 20);
  try {
    const stored = localStorage.getItem(BGIMG);
    if (stored && /^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(stored)) bgImg = stored;
  } catch {
    bgImg = '';
  }
  applyTheme();
  applyBgImg();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitTask();
  });

  // 输入法选词的 Enter 不能当成提交
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      submitTask();
    }
  });

  input.addEventListener('input', renderQuickHint);

  function clearSearch() {
    query = '';
    searchInput.value = '';
    render();
    searchInput.focus();
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim();
    render();
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !e.isComposing) {
      e.preventDefault();
      clearSearch();
    }
  });

  searchClear.addEventListener('click', clearSearch);

  themeBtn.addEventListener('click', cycleTheme);

  darkMq.addEventListener('change', () => {
    if (prefs.theme === '') applyTheme();
  });

  statDone.addEventListener('click', () => {
    prefs.hideCompleted = !prefs.hideCompleted;
    save();
    render();
  });

  toggleHiddenBtn.addEventListener('click', () => {
    prefs.hideCompleted = !prefs.hideCompleted;
    save();
    render();
  });

  histToggle.addEventListener('click', () => {
    prefs.historyOpen = !prefs.historyOpen;
    save();
    render();
  });

  statsToggle.addEventListener('click', () => {
    prefs.statsOpen = !prefs.statsOpen;
    save();
    render();
  });

  exportBtn.addEventListener('click', exportBackup);

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (file) importBackup(file);
    importFile.value = '';
  });

  $('new-due-clear').addEventListener('click', () => {
    newDue.value = '';
    input.focus();
  });

  histDate.addEventListener('change', () => {
    prefs.dateFilter = histDate.value;
    save();
    render();
  });

  clearDoneBtn.addEventListener('click', () => {
    const n = tasks.filter(t => t.done).length;
    askConfirm('清空已完成', '确定删除 ' + n + ' 条已完成的任务吗？删除后 6 秒内可以撤销。', () => {
      snapshot('已清空 ' + n + ' 条已完成任务', tasks);
      tasks = tasks.filter(t => !t.done);
    });
  });

  clearAllBtn.addEventListener('click', () => {
    if (!tasks.length) return;
    askConfirm('确认清空', '确定要清空所有任务吗？删除后 6 秒内可以撤销。', () => {
      snapshot('已清空全部 ' + tasks.length + ' 条任务', tasks);
      tasks = [];
      editingId = null;
      expanded.clear();
    });
  });

  modalCancel.addEventListener('click', closeConfirm);
  modalOk.addEventListener('click', () => {
    if (confirmAction) confirmAction();
    closeConfirm();
    save();
    render();
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeConfirm();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.hidden) closeConfirm();
  });

  renderPrioPicker();
  renderRepPicker();
  renderQuickHint();
  seed();
  render();
</script>
</body>
