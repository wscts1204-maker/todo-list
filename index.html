<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的待办清单</title>
<style>
  :root {
    --gray-800: #1f2937;
    --gray-700: #374151;
    --gray-600: #4b5563;
    --gray-500: #6b7280;
    --gray-400: #9ca3af;
    --gray-300: #d1d5db;
    --gray-200: #e5e7eb;
    --gray-100: #f3f4f6;
    --gray-50: #f9fafb;
    --blue-500: #3b82f6;
    --blue-600: #2563eb;
    --blue-50: #eff6ff;
    --green-800: #166534;
    --green-600: #16a34a;
    --green-500: #22c55e;
    --green-100: #dcfce7;
    --green-50: #f0fdf4;
    --red-800: #991b1b;
    --red-600: #dc2626;
    --red-500: #ef4444;
    --red-400: #f87171;
    --red-100: #fee2e2;
    --red-50: #fef2f2;
    --yellow-800: #854d0e;
    --yellow-600: #ca8a04;
    --yellow-500: #eab308;
    --yellow-100: #fef9c3;
    --yellow-50: #fefce8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #e3f0ff 0%, #e7e6fe 50%, #f3e6fd 100%);
    color: var(--gray-800);
    padding: 24px 12px 48px;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .wrap { width: 100%; max-width: 672px; margin: 0 auto; }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(15, 23, 42, .08), 0 4px 6px -4px rgba(15, 23, 42, .06);
  }

  /* ---------- header ---------- */
  .head { text-align: center; margin-bottom: 24px; padding-top: 12px; }

  .head-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--blue-500);
  }

  .head h1 { font-size: 30px; font-weight: 700; color: var(--gray-800); }

  .head p { font-size: 14px; color: var(--gray-600); }

  /* ---------- input card ---------- */
  .input-card { padding: 16px; margin-bottom: 16px; }

  .input-row { display: flex; flex-direction: column; gap: 12px; }

  #new-task {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    color: var(--gray-800);
    padding: 12px 16px;
    border: 1px solid var(--gray-200);
    border-radius: 12px;
    outline: none;
    transition: box-shadow .2s, border-color .2s;
  }

  #new-task::placeholder { color: var(--gray-400); }

  #new-task:focus {
    border-color: transparent;
    box-shadow: 0 0 0 2px var(--blue-500);
  }

  #add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 500;
    color: #fff;
    padding: 12px 24px;
    min-height: 48px;
    border-radius: 12px;
    background: var(--blue-500);
    box-shadow: 0 4px 6px -1px rgba(15, 23, 42, .1);
    transition: background .2s, box-shadow .2s;
  }

  #add:hover {
    background: var(--blue-600);
    box-shadow: 0 10px 15px -3px rgba(15, 23, 42, .12);
  }

  .prio-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }

  .prio-label { font-size: 14px; color: var(--gray-600); }

  .prio-btns { display: flex; gap: 4px; }

  .pbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 44px;
    min-height: 44px;
    padding: 12px;
    border-radius: 8px;
    background: var(--gray-100);
    color: var(--gray-600);
    font-size: 14px;
    transition: background .2s, color .2s;
  }

  .pbtn:hover { background: var(--gray-200); }

  .pbtn.on-high { background: var(--red-100); color: var(--red-600); }
  .pbtn.on-mid { background: var(--yellow-100); color: var(--yellow-600); }
  .pbtn.on-low { background: var(--green-100); color: var(--green-600); }

  .pbtn .txt { display: none; }

  .due-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .date-input {
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-800);
    padding: 8px 12px;
    min-height: 44px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
    background: #fff;
  }

  .date-input:focus { box-shadow: 0 0 0 2px var(--blue-500); border-color: transparent; }

  .due-clear { font-size: 13px; color: var(--gray-500); padding: 8px; min-height: 44px; }
  .due-clear:hover { color: var(--gray-700); }

  .tag-input {
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-800);
    width: 160px;
    max-width: 100%;
    padding: 8px 12px;
    min-height: 44px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
    background: #fff;
  }

  .tag-input:focus { box-shadow: 0 0 0 2px var(--blue-500); border-color: transparent; }

  .tag-hint { font-size: 12px; color: var(--gray-400); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
  }

  .stat {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(15, 23, 42, .1);
    padding: 12px;
    text-align: center;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: background .2s;
  }

  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { background: var(--gray-50); }
  .stat.active { box-shadow: 0 0 0 2px var(--blue-500); }

  .stat b { font-size: 20px; font-weight: 700; }
  .stat b.blue { color: var(--blue-600); }
  .stat b.green { color: var(--green-600); }
  .stat span { font-size: 12px; color: var(--gray-600); }

  .tool-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .tbtn {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    padding: 12px 16px;
    min-height: 44px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(15, 23, 42, .1);
    transition: background .2s, box-shadow .2s;
  }

  .tbtn:hover { box-shadow: 0 10px 15px -3px rgba(15, 23, 42, .12); }
  .tbtn.red { background: var(--red-500); }
  .tbtn.red:hover { background: var(--red-600); }
  .tbtn.gray { background: var(--gray-500); }
  .tbtn.gray:hover { background: var(--gray-700); }

  /* ---------- list ---------- */
  .list-card { overflow: hidden; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 12px 0;
  }

  .filter-bar[hidden] { display: none; }

  .filter-bar + .filter-bar { margin-top: 8px; }

  .filter-label { font-size: 13px; color: var(--gray-500); margin-right: 2px; }

  .fbtn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    background: var(--gray-100);
    padding: 6px 12px;
    min-height: 36px;
    border-radius: 999px;
    transition: background .2s, color .2s;
  }

  .fbtn:hover { background: var(--gray-200); }
  .fbtn.on { background: var(--blue-500); color: #fff; }
  .fbtn .n { font-size: 12px; opacity: .8; }

  #list { list-style: none; }

  #list > li + li > .row { border-top: 1px solid var(--gray-100); }

  .row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px;
    border-left: 4px solid transparent;
    transition: background .2s;
  }

  .row:hover { background: var(--gray-50); }

  .row.p-high { border-left-color: var(--red-500); background: var(--red-50); }
  .row.p-mid { border-left-color: var(--yellow-500); background: var(--yellow-50); }
  .row.p-low { border-left-color: var(--green-500); background: var(--green-50); }
  .row.p-high:hover, .row.p-mid:hover, .row.p-low:hover { background: var(--gray-50); }
  .row.done { border-left-color: transparent; background: var(--gray-50); }

  .grip {
    color: var(--gray-300);
    width: 24px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: -8px;
    cursor: grab;
    touch-action: none;
    transition: color .2s;
  }

  .grip:hover { color: var(--gray-500); }
  li.dragging .grip { cursor: grabbing; }

  .tick {
    color: var(--blue-500);
    width: 44px;
    height: 44px;
    margin-left: -8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: color .2s;
  }

  .tick:hover { color: var(--blue-600); }

  .body { flex: 1; min-width: 0; }

  .text-line {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .txt {
    font-size: 14px;
    color: var(--gray-800);
    word-break: break-word;
  }

  .done .txt {
    color: var(--gray-400);
    text-decoration: line-through;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 999px;
  }

  .badge.high { background: var(--red-100); color: var(--red-800); }
  .badge.mid { background: var(--yellow-100); color: var(--yellow-800); }
  .badge.low { background: var(--green-100); color: var(--green-800); }

  .due {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    color: var(--gray-500);
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--gray-100);
  }

  .due.soon { background: var(--blue-50); color: var(--blue-600); }
  .due.over { background: var(--red-100); color: var(--red-800); font-weight: 500; }

  .tg {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    font-size: 12px;
    color: var(--gray-600);
    padding: 3px 8px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--gray-200);
  }

  .done .tg { color: var(--gray-400); }

  li.dragging { opacity: .5; }
  li.dragging > .row { background: var(--blue-50); }
  li.drop-above { box-shadow: inset 0 3px 0 0 var(--blue-500); }
  li.drop-below { box-shadow: inset 0 -3px 0 0 var(--blue-500); }

  .list-empty {
    padding: 24px 16px;
    text-align: center;
    font-size: 14px;
    color: var(--gray-500);
  }

  .acts { display: flex; align-items: center; gap: 4px; margin-left: 8px; }

  .ibtn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 8px;
    border-radius: 8px;
    transition: background .2s, color .2s;
  }

  .ibtn.edit { color: var(--blue-500); }
  .ibtn.edit:hover { color: var(--blue-600); background: var(--blue-50); }
  .ibtn.del { color: var(--red-400); }
  .ibtn.del:hover { color: var(--red-600); background: var(--red-50); }
  .ibtn.ok { color: var(--green-600); }
  .ibtn.ok:hover { color: var(--green-800); }
  .ibtn.no { color: var(--gray-600); }
  .ibtn.no:hover { color: var(--gray-800); }

  .edit-input {
    flex: 1 1 100%;
    min-width: 0;
    font-size: 14px;
    font-family: inherit;
    color: var(--gray-800);
    padding: 8px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
  }

  .edit-input:focus { box-shadow: 0 0 0 2px var(--blue-500); border-color: transparent; }

  .edit-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .edit-wrap .tag-input { flex: 1 1 120px; width: auto; }

  /* ---------- empty state ---------- */
  .empty {
    padding: 48px 16px;
    text-align: center;
  }

  .empty[hidden] { display: none; }

  .empty .ring { color: var(--gray-300); display: inline-flex; margin-bottom: 16px; }

  .empty h3 { font-size: 18px; font-weight: 600; color: var(--gray-800); margin-bottom: 8px; }

  .empty > p { font-size: 14px; color: var(--gray-600); }

  .steps {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .step b {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: var(--blue-50);
    color: var(--blue-600);
    font-size: 13px;
  }

  .step span { font-size: 12px; color: var(--gray-500); }

  /* ---------- history ---------- */
  .hist-card { padding: 16px; margin-top: 16px; }

  .hist-card[hidden] { display: none; }

  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .hist-head h3 { font-size: 18px; font-weight: 600; color: var(--gray-800); }

  .chev { color: var(--gray-500); padding: 4px; display: flex; transition: color .2s; }
  .chev:hover { color: var(--gray-700); }

  .hist-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .hist-filter label { font-size: 13px; color: var(--gray-500); }

  .hist-filter input {
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-800);
    padding: 8px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    outline: none;
  }

  .hist-filter input:focus { box-shadow: 0 0 0 2px var(--blue-500); border-color: transparent; }

  .hist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    background: var(--gray-50);
  }

  .hist-item + .hist-item { margin-top: 8px; }

  .hist-item .ico { color: var(--green-600); display: flex; flex-shrink: 0; }

  .hist-item .info { flex: 1; min-width: 0; }

  .hist-item .t { font-size: 14px; color: var(--gray-800); text-decoration: line-through; word-break: break-word; }

  .hist-item .time { font-size: 12px; color: var(--gray-500); }

  .hist-item .badge { flex-shrink: 0; }

  .hist-empty { font-size: 14px; color: var(--gray-500); text-align: center; padding: 16px; }

  .total {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--gray-500);
    padding: 0 16px;
  }

  /* ---------- 备份 ---------- */
  .backup-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }

  .bbtn {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    background: rgba(255, 255, 255, .75);
    border: 1px solid var(--gray-200);
    padding: 8px 14px;
    min-height: 40px;
    border-radius: 999px;
    transition: background .2s, color .2s, border-color .2s;
  }

  .bbtn:hover { background: #fff; color: var(--gray-800); border-color: var(--gray-300); }

  .bmsg { font-size: 12px; color: var(--gray-500); }
  .bmsg.err { color: var(--red-600); }

  #import-file { display: none; }

  /* ---------- modal ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .backdrop[hidden] { display: none; }

  .dialog {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 384px;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, .35);
  }

  .dialog-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .dialog-head .warn { color: var(--red-500); display: flex; }

  .dialog h3 { font-size: 18px; font-weight: 600; color: var(--gray-800); }

  .dialog p { font-size: 14px; color: var(--gray-600); margin-bottom: 24px; }

  .dialog-actions { display: flex; justify-content: flex-end; gap: 12px; }

  .dbtn {
    font-size: 14px;
    padding: 8px 16px;
    min-height: 44px;
    border-radius: 8px;
    transition: background .2s, color .2s;
  }

  .dbtn.plain { color: var(--gray-600); }
  .dbtn.plain:hover { color: var(--gray-800); }
  .dbtn.danger { background: var(--red-500); color: #fff; }
  .dbtn.danger:hover { background: var(--red-600); }

  @media (min-width: 640px) {
    body { padding: 40px 24px 64px; }
    .head { margin-bottom: 32px; padding-top: 20px; }
    .head h1 { font-size: 36px; }
    .head p { font-size: 16px; }
    .input-card { padding: 24px; margin-bottom: 24px; }
    .input-row { flex-direction: row; gap: 12px; }
    #add { min-height: 44px; }
    .prio-btns { gap: 8px; }
    .pbtn .txt { display: inline; }
    .date-input { font-size: 16px; }
    .filter-bar { padding: 16px 16px 0; }
    .grip { width: 32px; margin-left: -12px; }
    .toolbar { flex-direction: row; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .stats { gap: 16px; width: auto; }
    .stat { padding: 16px; }
    .stat b { font-size: 24px; }
    .stat span { font-size: 14px; }
    .tool-actions { flex-direction: row; width: auto; }
    .tbtn { font-size: 16px; padding: 12px 16px; }
    .row { padding: 16px; }
    .tick { margin-right: 6px; }
    .txt { font-size: 16px; }
    .text-line { flex-direction: row; align-items: center; }
    .edit-input { font-size: 16px; flex: 1 1 220px; }
    .edit-wrap .tag-input { flex: 0 0 140px; width: 140px; }
    .empty { padding: 56px 24px; }
    .empty > p { font-size: 16px; }
    .hist-card { padding: 24px; }
    .hist-item .t { font-size: 16px; }
    .dialog p { font-size: 16px; }
    .dbtn { font-size: 16px; }
    .total { font-size: 14px; margin-top: 24px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="head-top">
        <span id="head-ico"></span>
        <h1>我的待办清单</h1>
      </div>
      <p>管理您的日常任务</p>
    </header>

    <section class="card input-card">
      <form id="form" class="input-row" autocomplete="off">
        <input id="new-task" type="text" placeholder="今天要做什么？" maxlength="200">
        <button id="add" type="submit">➕ 添加任务</button>
      </form>
      <div class="prio-row">
        <span class="prio-label">优先级：</span>
        <div class="prio-btns" id="prio-btns"></div>
      </div>
      <div class="due-row">
        <span class="prio-label">到期日：</span>
        <input type="date" id="new-due" class="date-input">
        <button type="button" id="new-due-clear" class="due-clear">清除</button>
        <span class="prio-label" style="margin-left:auto">提示：拖动左侧把手可排序</span>
      </div>
      <div class="due-row">
        <span class="prio-label">分类：</span>
        <input type="text" id="new-tag" class="tag-input" list="tag-list" maxlength="12" placeholder="学习 / 生活">
        <datalist id="tag-list"></datalist>
        <span class="tag-hint">输入新名字即可新建分类</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="stats">
        <div class="stat"><b id="pending-count" class="blue">0</b><span>待完成</span></div>
        <div class="stat clickable" id="stat-done"><b id="done-count" class="green">0</b><span>已完成</span></div>
      </div>
      <div class="tool-actions">
        <button id="toggle-hidden" class="tbtn red" type="button">隐藏已完成任务</button>
        <button id="clear-done" class="tbtn gray" type="button">清空已完成</button>
        <button id="clear-all" class="tbtn gray" type="button">全部清空</button>
      </div>
    </section>

    <section class="card list-card">
      <div id="filters" class="filter-bar"></div>
      <div id="tag-filters" class="filter-bar"></div>
      <ul id="list"></ul>
      <div id="empty" class="empty">
        <span class="ring" id="empty-ico"></span>
        <h3>还没有任务</h3>
        <p>添加一个任务开始管理您的待办事项吧！</p>
        <div class="steps">
          <div class="step"><b>1</b><span>输入任务</span></div>
          <div class="step"><b>2</b><span>选择优先级</span></div>
          <div class="step"><b>3</b><span>点击添加</span></div>
        </div>
      </div>
    </section>

    <section id="history" class="card hist-card">
      <div class="hist-head">
        <h3>已完成任务历史</h3>
        <button id="hist-toggle" class="chev" type="button" title="展开/收起"></button>
      </div>
      <div id="hist-body">
        <div class="hist-filter">
          <label for="hist-date">按日期筛选</label>
          <input type="date" id="hist-date">
        </div>
        <div id="hist-list"></div>
      </div>
    </section>

    <p id="total" class="total">共 0 个任务</p>

    <div class="backup-row">
      <button id="export-btn" class="bbtn" type="button">⬇ 导出备份</button>
      <button id="import-btn" class="bbtn" type="button">⬆ 导入备份</button>
      <input type="file" id="import-file" accept=".json,application/json">
      <span id="backup-msg" class="bmsg"></span>
    </div>
  </div>

  <div id="modal" class="backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="dialog-head">
        <span class="warn" id="modal-ico"></span>
        <h3 id="modal-title">确认清空</h3>
      </div>
      <p id="modal-text">确定要清空所有任务吗？此操作无法撤销。</p>
      <div class="dialog-actions">
        <button id="modal-cancel" class="dbtn plain" type="button">取消</button>
        <button id="modal-ok" class="dbtn danger" type="button">确认清空</button>
      </div>
    </div>
  </div>

<script>
  const KEY = 'todo.tasks';
  const PREF = 'todo.prefs';

  // ---------- 手写清单初始化数据（首次打开自动导入，按文本去重） ----------
  const SEED_KEY = 'todo.seed';
  const SEED_VERSION = 1;
  const SEED_TASKS = [
    { text: '开通流量主 / 养号', priority: 'high' },
    { text: '今日头条', priority: 'high' },
    { text: '学习英语', priority: 'mid' },
    { text: '登录 team', priority: 'mid' },
    { text: 'deepseek + 小红书', priority: 'high' },
    { text: '安装 Codex', priority: 'mid' },
    { text: '闲鱼自动化', priority: 'mid' },
    { text: '写代码网页', priority: 'mid' },
    { text: '整理 C / D 盘', priority: 'low' },
    { text: '完善“健身 app”/“厨房小程序”', priority: 'mid' },
    { text: '学习 workbuddy（每日一个知识点 + AI 总结）', priority: 'mid' },
    { text: '建个人知识库', priority: 'high' },
    { text: '研究提示词', priority: 'high' },
    { text: '规范化健身（每日训练）', priority: 'high' },
    { text: '完善每日饮食', priority: 'mid' },
    { text: '学习穿搭搭配 / 护肤', priority: 'low' },
    { text: '考公 / 开店准备', priority: 'high' },
    { text: 'A 股股票知识点（每日 1-3 个）', priority: 'mid' },
    { text: '低压电工证 / 仪表证', priority: 'mid' },
    { text: '理财（定投 / 周度复盘）', priority: 'mid' },
    { text: 'AI + markdown 排版学习', priority: 'low' },
    { text: '薅羊毛', priority: 'low' },
    { text: '练字', priority: 'low' },
    { text: 'AI + 剪辑（打通 / 熟练使用）', priority: 'mid' },
    { text: '学习做家常小炒（一周 3-4 道）', priority: 'low' },
    { text: 'AI 仿生人学习（知识体系）', priority: 'mid' },
    { text: '智能体 / skill / RAG 学习', priority: 'high' },
  ];

  const PATHS = {
    listTodo: '<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
    feather: '<path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/>',
    circle: '<circle cx="12" cy="12" r="10"/>',
    checkCircle: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    chevronUp: '<path d="m18 15-6-6-6 6"/>',
    chevronDown: '<path d="m6 9 6 6 6-6"/>',
    alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    grip: '<circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>',
    calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 4H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
  };

  function icon(name, size) {
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + PATHS[name] + '</svg>';
  }

  const LEVELS = {
    high: { label: '高', icon: 'flame' },
    mid: { label: '中', icon: 'scale' },
    low: { label: '低', icon: 'feather' },
  };

  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const input = $('new-task');
  const prioBox = $('prio-btns');
  const newDue = $('new-due');
  const newTag = $('new-tag');
  const tagList = $('tag-list');
  const filters = $('filters');
  const tagFilters = $('tag-filters');
  const list = $('list');
  const empty = $('empty');
  const history = $('history');
  const histBody = $('hist-body');
  const histList = $('hist-list');
  const histDate = $('hist-date');
  const histToggle = $('hist-toggle');
  const pendingCount = $('pending-count');
  const doneCount = $('done-count');
  const statDone = $('stat-done');
  const toggleHiddenBtn = $('toggle-hidden');
  const clearDoneBtn = $('clear-done');
  const clearAllBtn = $('clear-all');
  const total = $('total');
  const exportBtn = $('export-btn');
  const importBtn = $('import-btn');
  const importFile = $('import-file');
  const backupMsgEl = $('backup-msg');
  const modal = $('modal');
  const modalTitle = $('modal-title');
  const modalText = $('modal-text');
  const modalOk = $('modal-ok');
  const modalCancel = $('modal-cancel');

  let tasks = load();
  let prefs = loadPrefs();
  let newPriority = 'mid';
  let editingId = null;
  let confirmAction = null;
  let dragging = null;

  const FILTERS = [
    { key: 'all', label: '全部' },
    { key: 'overdue', label: '已逾期' },
    { key: 'today', label: '今天到期' },
    { key: 'week', label: '未来 7 天' },
    { key: 'nodate', label: '无日期' },
  ];

  function load() {
    let raw;
    try {
      raw = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch {
      return [];
    }
    return raw.map(t => ({ priority: 'mid', completedAt: null, due: '', tag: '', ...t }));
  }

  function loadPrefs() {
    const fallback = { hideCompleted: false, historyOpen: true, dateFilter: '', listFilter: 'all', tagFilter: 'all' };
    try {
      return { ...fallback, ...(JSON.parse(localStorage.getItem(PREF)) || {}) };
    } catch {
      return fallback;
    }
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(tasks));
    localStorage.setItem(PREF, JSON.stringify(prefs));
  }

  function uid() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  // 首次（或升级版本时）把清单导入，已存在同名任务则跳过，避免重复
  function seed() {
    let applied = 0;
    try {
      applied = Number(localStorage.getItem(SEED_KEY)) || 0;
    } catch {
      applied = 0;
    }
    if (applied >= SEED_VERSION) return;

    const existing = new Set(tasks.map(t => t.text));
    for (const item of SEED_TASKS) {
      if (existing.has(item.text)) continue;
      tasks.push({
        id: uid(),
        text: item.text,
        priority: item.priority,
        due: '',
        tag: '',
        done: false,
        completedAt: null,
        createdAt: Date.now(),
      });
      existing.add(item.text);
    }

    try {
      localStorage.setItem(SEED_KEY, String(SEED_VERSION));
    } catch {
      /* 忽略存储失败 */
    }
    save();
  }

  function level(task) {
    return LEVELS[task.priority] ? task.priority : 'mid';
  }

  function dayKey(ts) {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 把 'YYYY-MM-DD' 当本地日期解析，避免 UTC 偏移导致差一天
  function parseDay(s) {
    const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!p) return null;
    return new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3]));
  }

  // 距今天多少天：负数=已逾期，0=今天
  function dueInDays(task) {
    const due = parseDay(task.due);
    if (!due) return null;
    const today = parseDay(dayKey(Date.now()));
    return Math.round((due - today) / 86400000);
  }

  // 日期筛选：all / overdue / today / week / nodate
  function matchDate(task, key) {
    if (key === 'all') return true;
    if (key === 'nodate') return !task.due;
    const d = dueInDays(task);
    if (d === null) return false;
    if (key === 'today') return d === 0;
    if (key === 'week') return d >= 0 && d <= 6;
    if (key === 'overdue') return d < 0 && !task.done;
    return true;
  }

  // 分类筛选：all / ''（未分类）/ 分类名
  function matchTag(task, key) {
    if (key === 'all') return true;
    return (task.tag || '') === key;
  }

  function matchFilter(task) {
    return matchDate(task, prefs.listFilter) && matchTag(task, prefs.tagFilter);
  }

  function activeTasks() {
    return prefs.hideCompleted ? tasks.filter(t => !t.done) : tasks;
  }

  function visibleTasks() {
    return activeTasks().filter(matchFilter);
  }

  function usedTags() {
    const set = new Set();
    for (const t of tasks) if (t.tag) set.add(t.tag);
    return [...set].sort((a, b) => a.localeCompare(b, 'zh'));
  }

  function dueText(task) {
    const d = dueInDays(task);
    if (d === null) return '';
    if (d < 0) return '逾期 ' + (-d) + ' 天';
    if (d === 0) return '今天到期';
    if (d === 1) return '明天到期';
    if (d <= 6) return d + ' 天后到期';
    return task.due.slice(5).replace('-', '/') + ' 到期';
  }

  function renderPrioPicker() {
    prioBox.textContent = '';
    for (const [key, lv] of Object.entries(LEVELS)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pbtn' + (newPriority === key ? ' on-' + key : '');
      b.title = lv.label + '优先级';
      b.innerHTML = icon(lv.icon, 20) + '<span class="txt">' + lv.label + '</span>';
      b.addEventListener('click', () => {
        newPriority = key;
        renderPrioPicker();
      });
      prioBox.append(b);
    }
  }

  function renderFilters() {
    filters.hidden = tasks.length === 0;
    filters.textContent = '';
    if (!tasks.length) return;

    const label = document.createElement('span');
    label.className = 'filter-label';
    label.textContent = '按日期筛选：';
    filters.append(label);

    const base = activeTasks();
    for (const f of FILTERS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fbtn' + (prefs.listFilter === f.key ? ' on' : '');
      b.textContent = f.label;
      if (f.key !== 'all') {
        const num = document.createElement('span');
        num.className = 'n';
        num.textContent = base.filter(t => matchDate(t, f.key) && matchTag(t, prefs.tagFilter)).length;
        b.append(num);
      }
      b.setAttribute('aria-pressed', String(prefs.listFilter === f.key));
      b.addEventListener('click', () => {
        prefs.listFilter = f.key;
        save();
        render();
      });
      filters.append(b);
    }
  }

  function renderTagFilters() {
    const tags = usedTags();
    tagFilters.hidden = tags.length === 0;
    tagFilters.textContent = '';
    if (!tags.length) return;

    const label = document.createElement('span');
    label.className = 'filter-label';
    label.textContent = '按分类筛选：';
    tagFilters.append(label);

    const base = activeTasks();
    const items = [{ key: 'all', label: '全部分类' }, ...tags.map(t => ({ key: t, label: t }))];
    if (base.some(t => !t.tag)) items.push({ key: '', label: '未分类' });

    for (const it of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fbtn' + (prefs.tagFilter === it.key ? ' on' : '');
      b.textContent = it.label;
      if (it.key !== 'all') {
        const num = document.createElement('span');
        num.className = 'n';
        num.textContent = base.filter(t => matchTag(t, it.key) && matchDate(t, prefs.listFilter)).length;
        b.append(num);
      }
      b.setAttribute('aria-pressed', String(prefs.tagFilter === it.key));
      b.addEventListener('click', () => {
        prefs.tagFilter = it.key;
        if (it.key) newTag.value = it.key;
        save();
        render();
      });
      tagFilters.append(b);
    }
  }

  function renderTagOptions() {
    tagList.textContent = '';
    for (const t of usedTags()) {
      const opt = document.createElement('option');
      opt.value = t;
      tagList.append(opt);
    }
  }

  function render() {
    list.textContent = '';

    if (prefs.tagFilter !== 'all' && prefs.tagFilter !== '' && !usedTags().includes(prefs.tagFilter)) {
      prefs.tagFilter = 'all';
      save();
    }

    const done = tasks.filter(t => t.done);
    const shown = visibleTasks();

    for (const task of shown) {
      list.append(renderRow(task));
    }

    if (tasks.length && !shown.length) {
      const conds = [];
      if (prefs.listFilter !== 'all') conds.push(FILTERS.find(f => f.key === prefs.listFilter).label);
      if (prefs.tagFilter !== 'all') conds.push(prefs.tagFilter ? '分类「' + prefs.tagFilter + '」' : '未分类');
      const none = document.createElement('li');
      none.className = 'list-empty';
      none.textContent = conds.length
        ? '当前筛选条件下没有任务（' + conds.join(' · ') + '）'
        : '没有可显示的任务';
      list.append(none);
    }

    empty.hidden = tasks.length > 0;

    renderFilters();
    renderTagFilters();
    renderTagOptions();
    renderHistory(done);

    pendingCount.textContent = tasks.length - done.length;
    doneCount.textContent = done.length;
    total.textContent = '共 ' + tasks.length + ' 个任务' + (shown.length !== tasks.length ? '（当前显示 ' + shown.length + ' 个）' : '');
    toggleHiddenBtn.textContent = prefs.hideCompleted ? '显示已完成任务' : '隐藏已完成任务';
    statDone.classList.toggle('active', prefs.hideCompleted);
    clearDoneBtn.hidden = done.length === 0;
  }

  function renderRow(task) {
    const li = document.createElement('li');
    li.dataset.id = task.id;
    const row = document.createElement('div');
    row.className = 'row p-' + level(task) + (task.done ? ' done' : '');

    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.innerHTML = icon('grip', 18);
    grip.setAttribute('aria-label', '拖动排序');
    if (task.id === editingId) grip.style.visibility = 'hidden';
    else grip.addEventListener('pointerdown', (e) => startDrag(e, li, task.id));
    row.append(grip);

    const tick = document.createElement('button');
    tick.type = 'button';
    tick.className = 'tick';
    tick.innerHTML = icon(task.done ? 'checkCircle' : 'circle', 22);
    tick.setAttribute('aria-label', task.done ? '标记为未完成' : '标记为已完成');
    tick.addEventListener('click', () => toggle(task.id));
    row.append(tick);

    const body = document.createElement('div');
    body.className = 'body';

    if (task.id === editingId) {
      body.append(...editControls(task));
    } else {
      const line = document.createElement('div');
      line.className = 'text-line';

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = task.text;
      txt.title = '双击编辑';
      txt.addEventListener('dblclick', () => startEdit(task.id));

      const badge = document.createElement('span');
      badge.className = 'badge ' + level(task);
      badge.innerHTML = icon(LEVELS[level(task)].icon, 12) + LEVELS[level(task)].label;

      line.append(txt, badge);

      const d = dueInDays(task);
      if (d !== null) {
        const due = document.createElement('span');
        due.className = 'due' + (d < 0 ? ' over' : d <= 1 ? ' soon' : '');
        due.innerHTML = icon('calendar', 12) + dueText(task);
        line.append(due);
      }

      if (task.tag) {
        const tg = document.createElement('span');
        tg.className = 'tg';
        tg.innerHTML = icon('tag', 12);
        tg.append(task.tag);
        line.append(tg);
      }

      body.append(line);
      row.append(body);

      const acts = document.createElement('div');
      acts.className = 'acts';

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'ibtn edit';
      edit.innerHTML = icon('pencil', 18);
      edit.setAttribute('aria-label', '编辑任务');
      edit.addEventListener('click', () => startEdit(task.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'ibtn del';
      del.innerHTML = icon('trash', 18);
      del.setAttribute('aria-label', '删除任务');
      del.addEventListener('click', () => remove(task.id));

      acts.append(edit, del);
      row.append(acts);
      li.append(row);
      return li;
    }

    row.append(body);
    li.append(row);
    return li;
  }

  function editControls(task) {
    const wrap = document.createElement('div');
    wrap.className = 'edit-wrap';

    const box = document.createElement('input');
    box.type = 'text';
    box.className = 'edit-input';
    box.maxLength = 200;
    box.value = task.text;
    const dueBox = document.createElement('input');
    dueBox.type = 'date';
    dueBox.className = 'date-input';
    dueBox.value = task.due || '';
    dueBox.setAttribute('aria-label', '到期日');

    const tagBox = document.createElement('input');
    tagBox.type = 'text';
    tagBox.className = 'tag-input';
    tagBox.maxLength = 12;
    tagBox.list = 'tag-list';
    tagBox.value = task.tag || '';
    tagBox.placeholder = '分类';
    tagBox.setAttribute('aria-label', '分类');

    const commit = () => commitEdit(task.id, box.value, dueBox.value, tagBox.value);

    box.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    tagBox.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
      }
    });

    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'ibtn ok';
    ok.innerHTML = icon('check', 18);
    ok.setAttribute('aria-label', '保存');
    ok.addEventListener('click', commit);

    const no = document.createElement('button');
    no.type = 'button';
    no.className = 'ibtn no';
    no.innerHTML = icon('close', 18);
    no.setAttribute('aria-label', '取消编辑');
    no.addEventListener('click', cancelEdit);

    wrap.append(box, dueBox, tagBox, ok, no);
    return [wrap];
  }

  function renderHistory(done) {
    history.hidden = done.length === 0;
    histBody.hidden = !prefs.historyOpen;
    histToggle.innerHTML = icon(prefs.historyOpen ? 'chevronUp' : 'chevronDown', 20);
    histDate.value = prefs.dateFilter;

    if (!done.length) return;

    histList.textContent = '';
    const items = done
      .filter(t => !prefs.dateFilter || dayKey(t.completedAt || 0) === prefs.dateFilter)
      .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

    if (!items.length) {
      const none = document.createElement('div');
      none.className = 'hist-empty';
      none.textContent = '该日期没有已完成的任务';
      histList.append(none);
      return;
    }

    for (const task of items) {
      const item = document.createElement('div');
      item.className = 'hist-item';

      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.innerHTML = icon('checkCircle', 20);

      const info = document.createElement('div');
      info.className = 'info';

      const t = document.createElement('div');
      t.className = 't';
      t.textContent = task.text;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = '完成时间: ' + (task.completedAt ? new Date(task.completedAt).toLocaleString('zh-CN') : '—');

      info.append(t, time);

      const badge = document.createElement('span');
      badge.className = 'badge ' + level(task);
      badge.innerHTML = icon(LEVELS[level(task)].icon, 12) + LEVELS[level(task)].label;

      item.append(ico, info, badge);
      histList.append(item);
    }
  }

  // ---------- 拖拽排序（pointer 事件，鼠标与触摸通用） ----------
  function startDrag(ev, li, id) {
    if (dragging || (ev.button !== undefined && ev.button !== 0)) return;
    ev.preventDefault();

    const els = [...list.children].filter(el => el.dataset.id);
    const from = els.indexOf(li);
    if (from < 0) return;

    const rects = els.map(el => el.getBoundingClientRect());
    const startY = ev.clientY;
    let to = from;
    let moved = false;

    const mark = () => {
      for (const el of els) el.classList.remove('drop-above', 'drop-below');
      if (to === from) return;
      els[to].classList.add(to < from ? 'drop-above' : 'drop-below');
    };

    const onMove = (e) => {
      const dy = e.clientY - startY;
      if (!moved && Math.abs(dy) < 5) return;
      if (!moved) {
        moved = true;
        dragging = true;
        li.classList.add('dragging');
      }
      li.style.transform = 'translateY(' + dy + 'px)';
      let next = els.length - 1;
      for (let i = 0; i < rects.length; i++) {
        if (e.clientY < rects[i].top + rects[i].height / 2) {
          next = i;
          break;
        }
      }
      to = next;
      mark();
    };

    const finish = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', finish);
      document.removeEventListener('pointercancel', finish);
      li.classList.remove('dragging');
      li.style.transform = '';
      for (const el of els) el.classList.remove('drop-above', 'drop-below');
      dragging = null;
      if (moved && to !== from) {
        reorder(els.map(el => el.dataset.id), from, to);
        save();
      }
      render();
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', finish);
    document.addEventListener('pointercancel', finish);
  }

  // 在当前显示的序列里把第 from 项挪到 to；被筛选隐藏的项留在原槽位不动
  function reorder(visibleIds, from, to) {
    const ids = visibleIds.slice();
    const moved = ids.splice(from, 1);
    ids.splice(to > from ? to - 1 : to, 0, moved[0]);

    const vis = new Set(visibleIds);
    const slots = [];
    tasks.forEach((t, i) => { if (vis.has(t.id)) slots.push(i); });
    const byId = new Map(tasks.map(t => [t.id, t]));

    const next = tasks.slice();
    slots.forEach((slot, k) => { next[slot] = byId.get(ids[k]); });
    tasks = next;
  }

  function add(text, priority, due, tag) {
    tasks.push({ id: uid(), text, priority, due: due || '', tag: tag || '', done: false, completedAt: null, createdAt: Date.now() });
    save();
    render();
  }

  function toggle(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    task.completedAt = task.done ? Date.now() : null;
    save();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
    const box = list.querySelector('.edit-input');
    if (box) {
      box.focus();
      box.select();
    }
  }

  function commitEdit(id, value, due, tag) {
    const task = tasks.find(t => t.id === id);
    const text = value.trim();
    if (task && text) {
      task.text = text;
      task.due = due || '';
      task.tag = tag.trim();
    }
    editingId = null;
    save();
    render();
  }

  function cancelEdit() {
    editingId = null;
    render();
  }

  function remove(id) {
    tasks = tasks.filter(t => t.id !== id);
    if (editingId === id) editingId = null;
    save();
    render();
  }

  function askConfirm(title, text, action) {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalOk.textContent = title;
    confirmAction = action;
    modal.hidden = false;
    modalOk.focus();
  }

  function closeConfirm() {
    modal.hidden = true;
    confirmAction = null;
  }

  // ---------- 备份：导出 / 导入 JSON ----------
  function backupMsg(text, isErr) {
    backupMsgEl.textContent = text;
    backupMsgEl.classList.toggle('err', !!isErr);
  }

  function exportBackup() {
    if (!tasks.length) {
      backupMsg('还没有任务可导出', true);
      return;
    }
    const data = { app: 'todo-list', version: 1, exportedAt: new Date().toISOString(), tasks };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '待办备份-' + dayKey(Date.now()) + '.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    backupMsg('已导出 ' + tasks.length + ' 条任务');
  }

  function normalizeImported(raw) {
    const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.tasks) ? raw.tasks : null);
    if (!list) return null;

    const seen = new Set();
    const out = [];
    for (const t of list) {
      if (!t || typeof t.text !== 'string' || !t.text.trim()) continue;
      let id = typeof t.id === 'string' && t.id ? t.id : uid();
      if (seen.has(id)) id = uid();
      seen.add(id);
      out.push({
        id,
        text: t.text.trim(),
        priority: LEVELS[t.priority] ? t.priority : 'mid',
        due: /^\d{4}-\d{2}-\d{2}$/.test(t.due || '') ? t.due : '',
        tag: typeof t.tag === 'string' ? t.tag.trim().slice(0, 12) : '',
        done: !!t.done,
        completedAt: typeof t.completedAt === 'number' ? t.completedAt : null,
        createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now(),
      });
    }
    return out;
  }

  function importBackup(file) {
    backupMsg('');
    const reader = new FileReader();
    reader.onerror = () => backupMsg('读取文件失败', true);
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch {
        backupMsg('这个文件不是有效的 JSON 备份', true);
        return;
      }
      const incoming = normalizeImported(parsed);
      if (!incoming) {
        backupMsg('文件里没有找到任务列表', true);
        return;
      }
      if (!incoming.length) {
        backupMsg('文件里的任务列表是空的', true);
        return;
      }
      askConfirm('导入备份', '将用备份里的 ' + incoming.length + ' 条任务覆盖当前 ' + tasks.length + ' 条，此操作无法撤销。', () => {
        tasks = incoming;
        editingId = null;
        backupMsg('已导入 ' + incoming.length + ' 条任务');
      });
    };
    reader.readAsText(file);
  }

  function submitTask() {
    const text = input.value.trim();
    if (!text) return;
    add(text, newPriority, newDue.value, newTag.value.trim());
    input.value = '';
    newDue.value = '';
    input.focus();
  }

  $('head-ico').innerHTML = icon('listTodo', 28);
  $('empty-ico').innerHTML = icon('circle', 56);
  $('modal-ico').innerHTML = icon('alert', 24);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitTask();
  });

  // 输入法选词的 Enter 不能当成提交
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      submitTask();
    }
  });

  statDone.addEventListener('click', () => {
    prefs.hideCompleted = !prefs.hideCompleted;
    save();
    render();
  });

  toggleHiddenBtn.addEventListener('click', () => {
    prefs.hideCompleted = !prefs.hideCompleted;
    save();
    render();
  });

  histToggle.addEventListener('click', () => {
    prefs.historyOpen = !prefs.historyOpen;
    save();
    render();
  });

  exportBtn.addEventListener('click', exportBackup);

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', () => {
    const file = importFile.files[0];
    if (file) importBackup(file);
    importFile.value = '';
  });

  $('new-due-clear').addEventListener('click', () => {
    newDue.value = '';
    input.focus();
  });

  histDate.addEventListener('change', () => {
    prefs.dateFilter = histDate.value;
    save();
    render();
  });

  clearDoneBtn.addEventListener('click', () => {
    const n = tasks.filter(t => t.done).length;
    askConfirm('清空已完成', '确定删除 ' + n + ' 条已完成的任务吗？此操作无法撤销。', () => {
      tasks = tasks.filter(t => !t.done);
    });
  });

  clearAllBtn.addEventListener('click', () => {
    if (!tasks.length) return;
    askConfirm('确认清空', '确定要清空所有任务吗？此操作无法撤销。', () => {
      tasks = [];
      editingId = null;
    });
  });

  modalCancel.addEventListener('click', closeConfirm);
  modalOk.addEventListener('click', () => {
    if (confirmAction) confirmAction();
    closeConfirm();
    save();
    render();
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeConfirm();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.hidden) closeConfirm();
  });

  renderPrioPicker();
  seed();
  render();
</script>
</body>
</html>
